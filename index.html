@keyframes gG{0%,100%{box-shadow:0 0 8px rgba(234,179,8,.5),0 0 20px rgba(234,179,8,.2)}50%{box-shadow:0 0 18px rgba(234,179,8,.9),0 0 45px rgba(234,179,8,.4)}}
@keyframes fU{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes sL{0%{transform:translateY(-100vh)}100%{transform:translateY(100vh)}}

@keyframes blink{0%,100%{opacity:1}49%{opacity:1}50%{opacity:0}99%{opacity:0}}

.fu{animation:fU .35s ease forwards}

input,select,textarea{background:rgba(255,255,255,.05);border:1px solid rgba(147,51,234,.3);color:#fff;outline:none;font-family:'Courier New',monospace;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:#9333ea;box-shadow:0 0 12px rgba(147,51,234,.2)}
select option{background:#120a2e;color:#fff}

<script type="text/babel">
const {useState,useEffect,useCallback,useRef,useMemo}=React;

// ─── CONFIG ───
const FB     = "https://firestore.googleapis.com/v1/projects/afk-hub/databases/(default)/documents";
const FBKEY  = "AIzaSyAiDeA-B1wSCMEZ9FguSKHBjH3653JAwJA";
const FB_AUTH = "https://identitytoolkit.googleapis.com/v1";
const DSC    = "https://discord.com/api/webhooks/1507371598280396831/ieKValC7Jha84Z5HWWBgXBFXNFA-IBvKF7AdcDfk4-2ZdCADOMiVjSZFhJoWv_158vfs";

// ─── CONSTANTS ───
const STATUS_COLS  = ["pending","preparing","ready","completed"];
const STATUS_LABEL = {pending:"⏳ Chờ",preparing:"🔥 Đang pha",ready:"✅ Xong",completed:"🏁 Hoàn thành"};
const STATUS_COLOR = {pending:"#eab308",preparing:"#f97316",ready:"#22c55e",completed:"#4b5563"};

const ROLES        = ["owner","manager","staff"];
const ROLE_COLOR   = {owner:"#eab308",manager:"#a855f7",staff:"#22c55e"};

const LOG_TYPES    = ["import","usage","waste","manual_adjustment"];

const pct = (a,b) => b ? Math.round(a/b*100) : 0;

// ─── FIRESTORE HELPERS ───
async function fsGet(col,id=""){
  const url=id?`${FB}/${col}/${id}?key=${FBKEY}`:`${FB}/${col}?key=${FBKEY}&pageSize=500`;
  const r=await fetch(url); const d=await r.json();
  if(id) return d;
  return d.documents||[];
}
async function fsPatch(col,id,fields){
  const mask=Object.keys(fields).map(k=>`updateMask.fieldPaths=${k}`).join("&");
  const r=await fetch(`${FB}/${col}/${id}?${mask}&key=${FBKEY}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields})});
  return r.json();
}
async function fsPost(col,fields){
  const r=await fetch(`${FB}/${col}?key=${FBKEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields})});
  return r.json();
}
async function fsDel(col,id){ await fetch(`${FB}/${col}/${id}?key=${FBKEY}`,{method:"DELETE"}); }

// value converters
const toSV=v=>({stringValue:String(v||"")});
const toIV=v=>({integerValue:String(parseInt(v)||0)});
const toFV=v=>({doubleValue:parseFloat(v)||0});
const toBV=v=>({booleanValue:Boolean(v)});

function getF(fields={},key){
  const f=fields[key]; if(!f) return undefined;
  if(f.stringValue  !==undefined) return f.stringValue;
  if(f.integerValue !==undefined) return parseInt(f.integerValue);
  if(f.doubleValue  !==undefined) return parseFloat(f.doubleValue);
  if(f.booleanValue !==undefined) return f.booleanValue;
  if(f.arrayValue)  return (f.arrayValue.values||[]).map(v=>{
    if(v.mapValue) return Object.fromEntries(Object.entries(v.mapValue.fields||{}).map(([k,val])=>[k,getF({[k]:val},k)]));
    return getF({_:v},"_");
  });
  if(f.mapValue) return Object.fromEntries(Object.entries(f.mapValue.fields||{}).map(([k,v])=>[k,getF({[k]:v},k)]));
  return undefined;
}
function parseDoc(doc){
  const f=doc.fields||{}; const id=doc.name?.split("/").pop()||"";
  const out={_id:id};
  Object.keys(f).forEach(k=>{out[k]=getF(f,k);}); return out;
}

// ─── AUTH ───
const AUTH_KEY="afk_admin_session";
function saveSession(d){try{localStorage.setItem(AUTH_KEY,JSON.stringify(d));}catch{}}
function loadSession(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||"null");}catch{return null;}}
function clearSession(){try{localStorage.removeItem(AUTH_KEY);}catch{}}

async function signInEmail(email,password){
  const r=await fetch(`${FB_AUTH}/accounts:signInWithPassword?key=${FBKEY}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email,password,returnSecureToken:true}),
  });
  const d=await r.json();
  if(d.error) throw new Error(d.error.message);
  return d;
}

async function getEmployeeByAuth(uid,email){
  try{
    const docs=await fsGet("employees");
    const all=docs.map(parseDoc);
    const emp=all.find(e=>e.uid===uid)||all.find(e=>e.email?.toLowerCase()===email?.toLowerCase());
    if(emp){
      if(!emp.uid||emp.uid==="") await fsPatch("employees",emp._id,{uid:toSV(uid)}).catch(()=>{});
      return emp;
    }
    if(all.length===0) return{_id:"__setup__",uid,email,name:email.split("@")[0],role:"owner",active:true,isSetup:true};
    return null;
  }catch{return null;}
}

// ─── DISCORD ───
async function sendDiscord(order){
  const lines=order.items.map(i=>i.qty+"x "+i.name+(i.sweetness?" ("+i.sweetness+")":"")).join("\n");
  const pay=order.paymentMethod==="cash"?"💵 Tiền mặt":"🏦 Chuyển khoản";
  const msg="⚡ **ĐƠN MỚI — "+order.orderNumber+"**\n```\n"+lines+"\n```\n💰 **"+vnd(order.total)+"** · "+pay;
  try{
    const r=await fetch(DSC,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:msg})});
    const txt=await r.text().catch(()=>"");
    return{ok:r.ok,status:r.status,error:r.ok?null:txt};
  }catch(e){return{ok:false,status:0,error:e.message};}
}

// ─── MENU FIRESTORE HELPERS ───
async function fsLoadMenuItems(){
  try{
    const docs=await fsGet("menu");
    return docs.map(d=>{
      const f=d.fields||{}; const id=d.name.split("/").pop();
      return{
        _id:id,firestoreId:id,
        name:  f.name?.stringValue||"",
        price: parseInt(f.sellPrice?.integerValue||0),
        img:   f.imageUrl?.stringValue||"",
        available:f.available?.booleanValue!==false,
        g:["#2d1200","#8B4513"],em:"☕",
      };
    }).filter(i=>i.name);
  }catch(e){console.warn(e);return[];}
}
async function fsSaveMenuItem(item){
  const fields={
    name:     {stringValue:item.name||""},
    sellPrice:{integerValue:String(parseInt(item.price)||0)},
    imageUrl: {stringValue:item.img||""},
    available:{booleanValue:item.available!==false},
    stock:    {integerValue:"0"},
    recipe:   {arrayValue:{values:[]}},
    updatedAt:{stringValue:new Date().toISOString()},
  };
  if(item.firestoreId){
    await fetch(`${FB}/menu/${item.firestoreId}?key=${FBKEY}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields})});
  }else{
    fields.createdAt={stringValue:new Date().toISOString()};
    await fetch(`${FB}/menu?key=${FBKEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields})});
  }
}
async function fsDelMenuItem(firestoreId){
  await fetch(`${FB}/menu/${firestoreId}?key=${FBKEY}`,{method:"DELETE"});
}

// ─── MICRO COMPONENTS ───
function Scanline(){
  return <div style={{position:"fixed",top:0,left:0,right:0,height:"2px",background:"linear-gradient(transparent,rgba(147,51,234,.1),transparent)",animation:"sL 6s linear infinite",pointerEvents:"none",zIndex:9999}}/>;
}
function Corner({sz=8,c="#9333ea"}){
  const b=(t,r,b2,l)=>({position:"absolute",width:sz,height:sz,pointerEvents:"none",
    borderTop:t?`1px solid ${c}`:undefined,borderRight:r?`1px solid ${c}`:undefined,
    borderBottom:b2?`1px solid ${c}`:undefined,borderLeft:l?`1px solid ${c}`:undefined});
  return(
    <div style={{position:"absolute",inset:0,pointerEvents:"none"}}>
      <div style={{...b(1,0,0,1),top:0,left:0}}/><div style={{...b(1,1,0,0),top:0,right:0}}/>
      <div style={{...b(0,0,1,1),bottom:0,left:0}}/><div style={{...b(0,1,1,0),bottom:0,right:0}}/>
    </div>
  );
}
function Toast({msg,ok=true,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3500);return()=>clearTimeout(t);},[onDone]);
  return(
    <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:9998,whiteSpace:"nowrap",
      background:ok?"rgba(34,197,94,.15)":"rgba(239,68,68,.15)",
      border:`1px solid ${ok?"rgba(34,197,94,.5)":"rgba(239,68,68,.5)"}`,
      backdropFilter:"blur(12px)",borderRadius:10,padding:"10px 18px",fontSize:11,fontWeight:700,
      color:ok?"#22c55e":"#ef4444",boxShadow:`0 0 20px ${ok?"rgba(34,197,94,.3)":"rgba(239,68,68,.3)"}`}}>
      {msg}
    </div>
  );
}
function useToast(){
  const [t,setT]=useState(null);
  const show=(msg,ok=true)=>setT({msg,ok,k:Date.now()});
  const el=t?<Toast key={t.k} msg={t.msg} ok={t.ok} onDone={()=>setT(null)}/>:null;
  return[show,el];
}
function Spinner(){
  return <div className="sp" style={{width:18,height:18,border:"2px solid rgba(234,179,8,.2)",borderTop:"2px solid #eab308",borderRadius:"50%"}}/>;
}
function Badge({color,children}){
  return <span style={{background:`${color}18`,color,border:`1px solid ${color}40`,borderRadius:4,padding:"1px 7px",fontSize:9,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>{children}</span>;
}
function StatCard({label,value,sub,color="#eab308",icon}){

    <div className="gl fu" style={{borderRadius:10,padding:"13px 14px",position:"relative"}}>
      <Corner sz={6} c={color}/>

        <div>
          <div style={{fontSize:8,color:"#64748b",letterSpacing:2,marginBottom:4}}>{label}</div>
          <div style={{fontWeight:900,fontSize:20,color}}>{value}</div>
          {sub&&<div style={{fontSize:9,color:"#475569",marginTop:2}}>{sub}</div>}
        </div>
        {icon&&<div style={{fontSize:22,opacity:.7}}>{icon}</div>}
      </div>
    </div>

}
function Modal({title,onClose,children,wide=false}){
  return(
    <div style={{position:"fixed",inset:0,zIndex:700,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div onClick={onClose} style={{position:"absolute",inset:0,background:"rgba(0,0,0,.8)",backdropFilter:"blur(6px)"}}/>
      <div style={{position:"relative",zIndex:1,background:"#120a2e",borderRadius:14,border:"1px solid rgba(147,51,234,.4)",
        padding:20,width:"100%",maxWidth:wide?640:420,maxHeight:"90vh",overflow:"auto"}}>

function Field({label,children}){
  return(
    <div>
      <div style={{fontSize:9,color:"#64748b",letterSpacing:1,marginBottom:4,textTransform:"uppercase"}}>{label}</div>
      {children}
    </div>

}
function Inp(props){
  return <input {...props} style={{width:"100%",padding:"9px 12px",borderRadius:8,fontSize:12,...(props.style||{})}}/>;
}
function Sel({children,...props}){
  return <select {...props} style={{width:"100%",padding:"9px 12px",borderRadius:8,fontSize:12,...(props.style||{})}}>{children}</select>;
}

// ─── LOGIN ───
function LoginPage({onLogin}){
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);

  const submit=async()=>{
    setErr(""); setLoading(true);
    try{
      const auth=await signInEmail(email,pass);
      const emp=await getEmployeeByAuth(auth.localId,auth.email);
      if(!emp){setErr("Tài khoản chưa được thêm vào danh sách nhân viên. Liên hệ owner để được cấp quyền.");setLoading(false);return;}
      if(emp.active===false){setErr("Tài khoản đã bị vô hiệu hoá.");setLoading(false);return;}
      if(emp.isSetup){
        await fsPost("employees",{
          uid:toSV(auth.localId),email:toSV(auth.email),
          name:toSV(auth.email.split("@")[0]),role:toSV("owner"),
          active:toBV(true),phone:toSV(""),createdAt:toSV(new Date().toISOString()),
        });
      }
      const session={uid:auth.localId,email:auth.email,token:auth.idToken,
        role:emp.role||"owner",name:emp.name||auth.email.split("@")[0],employeeId:emp._id||""};
      saveSession(session); onLogin(session);
    }catch(e){
      const m=e.message||"";
      if(m.includes("INVALID_LOGIN_CREDENTIALS")||m.includes("INVALID_PASSWORD")||m.includes("EMAIL_NOT_FOUND"))
        setErr("Email hoặc mật khẩu không đúng.");
      else if(m.includes("TOO_MANY_ATTEMPTS")) setErr("Quá nhiều lần thử. Vui lòng đợi vài phút.");
      else setErr(m||"Đã xảy ra lỗi. Vui lòng thử lại.");
    }
    setLoading(false);
  };

  return(
    <div className="cy" style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
      background:"radial-gradient(ellipse at center,#1a0a3e 0%,#0a0714 70%)",padding:24}}>
      <div style={{position:"absolute",width:300,height:300,borderRadius:"50%",background:"rgba(147,51,234,.07)",top:"5%",left:"-20%",filter:"blur(60px)"}}/>
      <div style={{position:"absolute",width:250,height:250,borderRadius:"50%",background:"rgba(234,179,8,.05)",bottom:"5%",right:"-10%",filter:"blur(50px)"}}/>
      <div className="fu" style={{width:"100%",maxWidth:360}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div className="tg" style={{fontSize:24,fontWeight:900,letterSpacing:4,marginBottom:4}}>AFK CONTROL</div>
          <div style={{fontSize:9,letterSpacing:4,color:"rgba(147,51,234,.6)"}}>ADMIN SYSTEM v2.0</div>
        </div>
        <div className="gl" style={{borderRadius:14,padding:22,position:"relative"}}>
          <Corner sz={9} c="#9333ea"/>
          <div style={{display:"flex",flexDirection:"column",gap:13}}>
            <Field label="Email">
              <Inp type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="admin@afkhub.vn" onKeyDown={e=>e.key==="Enter"&&submit()}/>
            </Field>
            <Field label="Mật khẩu">
              <Inp type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&submit()}/>
            </Field>
            {err&&<div style={{fontSize:10,color:"#ef4444",textAlign:"center",padding:"7px",background:"rgba(239,68,68,.1)",borderRadius:7,border:"1px solid rgba(239,68,68,.3)"}}>{err}</div>}
            <button onClick={submit} disabled={loading} className="bb gg"
              style={{padding:"13px",borderRadius:10,fontSize:13,letterSpacing:2,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              {loading?<><Spinner/> ĐANG ĐĂNG NHẬP...</>:"⚡ ĐĂNG NHẬP"}
            </button>
          </div>
        </div>
        <div style={{marginTop:14,padding:"10px 14px",background:"rgba(234,179,8,.06)",border:"1px solid rgba(234,179,8,.18)",borderRadius:9,fontSize:9,color:"rgba(234,179,8,.75)",lineHeight:1.9}}>
          💡 <strong style={{color:"#eab308"}}>Lần đầu dùng?</strong><br/>
          Tạo tài khoản tại Firebase Console → Authentication → Add user,
          rồi đăng nhập — hệ thống tự cấp quyền <strong style={{color:"#eab308"}}>owner</strong> cho bạn.
        </div>
        <div style={{textAlign:"center",marginTop:10,fontSize:8,color:"rgba(147,51,234,.3)",letterSpacing:2}}>
          AFK HUB INTERNAL SYSTEM · UNAUTHORIZED ACCESS PROHIBITED
        </div>
      </div>
    </div>
  );
}

function Sidebar({active,onNav,session,onLogout,collapsed,onToggle}){
  const allowed=ROLE_ACCESS[session.role]||["orders"];
  return(
    <div style={{width:collapsed?56:200,flexShrink:0,background:"rgba(10,7,20,.98)",borderRight:"1px solid rgba(147,51,234,.2)",

      <nav style={{flex:1,padding:"8px 6px",display:"flex",flexDirection:"column",gap:2}}>
        {NAV_ITEMS.filter(n=>allowed.includes(n.id)).map(n=>{
          const on=active===n.id;
          return(
            <button key={n.id} onClick={()=>onNav(n.id)} style={{
              width:"100%",padding:collapsed?"10px":"9px 11px",borderRadius:8,display:"flex",
              alignItems:"center",gap:8,cursor:"pointer",border:"none",textAlign:"left",
              background:on?"linear-gradient(135deg,rgba(234,179,8,.15),rgba(234,179,8,.05))":"transparent",
              borderLeft:on?"2px solid #eab308":"2px solid transparent",
              color:on?"#eab308":"#64748b",transition:"all .15s",justifyContent:collapsed?"center":"flex-start",
              fontFamily:"'Courier New',monospace",
            }}>

// ─── DASHBOARD ───
function Dashboard({session}){
  const [orders,setOrders]=useState([]);
  const [ingrs,setIngrs]=useState([]);
  const [loading,setLoading]=useState(true);

  const load=useCallback(async()=>{
    setLoading(true);
    const[oDocs,iDocs]=await Promise.all([fsGet("orders"),fsGet("ingredients")]);
    setOrders(oDocs.map(parseDoc).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)));
    setIngrs(iDocs.map(parseDoc));
    setLoading(false);
  },[]);
  useEffect(()=>{load();const t=setInterval(load,20000);return()=>clearInterval(t);},[load]);

  const today=useMemo(()=>{const t=new Date().toDateString();return orders.filter(o=>new Date(o.createdAt).toDateString()===t);},[orders]);
  const todayRev=useMemo(()=>today.filter(o=>o.status!=="pending").reduce((s,o)=>s+(o.total||0),0),[today]);
  const pending=orders.filter(o=>o.status==="pending").length;
  const prep=orders.filter(o=>o.status==="preparing").length;
  const lowStock=ingrs.filter(i=>i.stockQuantity<=i.minimumStock);

  return(
    <div style={{padding:16,display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div className="tg" style={{fontWeight:900,fontSize:16,letterSpacing:2}}>DASHBOARD</div>
          <div style={{fontSize:9,color:"#475569",letterSpacing:1}}>Xin chào, {session.name} · <span className="blink" style={{color:"#22c55e"}}>●</span> LIVE</div>
        </div>
        <button onClick={load} className="gb" style={{padding:"6px 10px",borderRadius:7,fontSize:10,display:"flex",alignItems:"center",gap:5}}>
          {loading?<Spinner/>:"🔄"} Refresh
        </button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
        <StatCard label="Doanh thu hôm nay" value={vnd(todayRev)} sub={`${today.length} đơn`} icon="💰"/>
        <StatCard label="Đơn đang chờ" value={pending+prep} sub={`${pending} chờ · ${prep} pha`} color="#f97316" icon="⏳"/>
        <StatCard label="Tổng đơn" value={orders.length} sub="Tất cả thời gian" color="#a855f7" icon="📋"/>
        <StatCard label="Cảnh báo kho" value={lowStock.length} sub="Nguyên liệu sắp hết" color={lowStock.length>0?"#ef4444":"#22c55e"} icon="⚠️"/>
      </div>
      {lowStock.length>0&&(
        <div className="glr" style={{borderRadius:10,padding:12,position:"relative"}}>
          <Corner sz={7} c="#ef4444"/>
          <div style={{fontSize:9,color:"#ef4444",letterSpacing:2,marginBottom:8,fontWeight:700}}>⚠️ NGUYÊN LIỆU SẮP HẾT</div>
          {lowStock.slice(0,4).map(i=>(
            <div key={i._id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid rgba(239,68,68,.1)"}}>
              <span style={{fontSize:10,color:"#fca5a5"}}>{i.name}</span>
              <span style={{fontSize:10,color:"#ef4444",fontWeight:700}}>{i.stockQuantity} {i.unit} / min {i.minimumStock}</span>
            </div>
          ))}
        </div>
      )}
      <div>
        <div style={{fontSize:9,color:"#64748b",letterSpacing:2,marginBottom:8}}>HOẠT ĐỘNG GẦN ĐÂY</div>
        <div className="gl" style={{borderRadius:10,overflow:"hidden",position:"relative"}}>
          <Corner sz={7}/>
          {orders.slice(0,8).length===0?<div style={{padding:20,textAlign:"center",color:"#334155",fontSize:10}}>Chưa có đơn nào</div>
          :orders.slice(0,8).map((o,i)=>(
            <div key={o._id} style={{padding:"9px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:i<7?"1px solid rgba(147,51,234,.07)":"none"}}>
              <div>
                <span className="tg" style={{fontSize:11,fontWeight:900,marginRight:8}}>{o.orderNumber}</span>
                <Badge color={STATUS_COLOR[o.status]||"#64748b"}>{STATUS_LABEL[o.status]||o.status}</Badge>

              <div style={{textAlign:"right"}}>
                <div style={{fontSize:11,fontWeight:700}}>{vnd(o.total)}</div>
                <div style={{fontSize:8,color:"#475569"}}>{new Date(o.createdAt).toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── ORDERS PAGE (ported from AFK Control) ───
function OrdersPage({session}){
  const [orders,setOrders]=useState([]);
  const [loading,setLoading]=useState(true);
  const [q,setQ]=useState("");
  const [statusFilter,setStatusFilter]=useState("all");
  const [ts,setTs]=useState(null);
  const [dscTest,setDscTest]=useState(null);
  const [testing,setTesting]=useState(false);
  const [showToast,toastEl]=useToast();

  const load=useCallback(async()=>{
    setLoading(true);
    const docs=await fsGet("orders");
    setOrders(docs.map(parseDoc).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)));
    setTs(new Date());
    setLoading(false);
  },[]);
  useEffect(()=>{load();const t=setInterval(load,15000);return()=>clearInterval(t);},[load]);

  const updStatus=async(order,ns)=>{
    setOrders(p=>p.map(o=>o._id===order._id?{...o,status:ns}:o));
    try{
      await fsPatch("orders",order._id,{status:{stringValue:ns}});
      showToast(order.orderNumber+" → "+STATUS_LABEL[ns]);
      load();
    }catch(e){
      setOrders(p=>p.map(o=>o._id===order._id?{...o,status:order.status}:o));
      showToast("Lỗi: "+e.message,false);
    }
  };

  const testDiscord=async()=>{
    setTesting(true); setDscTest(null);
    const r=await sendDiscord({orderNumber:"AFK-TEST",items:[{qty:1,name:"Test Ping",sweetness:"Vừa vừa"}],total:15000,paymentMethod:"cash"});
    setDscTest(r.ok?{ok:true,msg:"✅ OK ("+r.status+")"}:{ok:false,msg:"❌ "+r.status+": "+r.error});
    setTesting(false);
  };

  const todayRev=useMemo(()=>orders.filter(o=>{const d=new Date(o.createdAt),t=new Date();return d.toDateString()===t.toDateString()&&o.status!=="pending";}).reduce((s,o)=>s+(o.total||0),0),[orders]);
  const activeCnt=orders.filter(o=>o.status==="pending"||o.status==="preparing").length;

  const filtered=orders.filter(o=>{
    const q2=q.toLowerCase();
    const mQ=!q||o.orderNumber?.toLowerCase().includes(q2)||o.items?.some?.(i=>i.name?.toLowerCase().includes(q2));
    const mS=statusFilter==="all"||o.status===statusFilter;
    return mQ&&mS;
  });

  return(
    <div style={{padding:16,display:"flex",flexDirection:"column",gap:12}}>
      {toastEl}

      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div className="tg" style={{fontWeight:900,fontSize:14,letterSpacing:2}}>📋 ĐƠN HÀNG</div>
        <button onClick={load} className="gb" style={{padding:"6px 10px",borderRadius:7,fontSize:10,display:"flex",alignItems:"center",gap:5}}>
          {loading?<Spinner/>:"🔄"}
        </button>
      </div>

      {/* Stats row — từ AFK Control */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7}}>
        {[["📦 Tổng",orders.length,"#9333ea"],["💰 Hôm nay",vnd(todayRev),"#eab308"],["⏳ Active",activeCnt,"#f97316"]].map(([lb,v,c])=>(
          <div key={lb} className="gl" style={{borderRadius:8,padding:"8px 10px",textAlign:"center",position:"relative"}}>
            <Corner sz={5} c={c}/>
            <div style={{fontSize:8,color:"#64748b",marginBottom:1}}>{lb}</div>
            <div style={{fontWeight:900,fontSize:13,color:c}}>{v}</div>
          </div>
        ))}
      </div>

      {/* Discord test — từ AFK Control */}
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <button onClick={testDiscord} disabled={testing} className="gb"
          style={{padding:"5px 11px",borderRadius:6,fontSize:10,display:"flex",alignItems:"center",gap:4,whiteSpace:"nowrap"}}>
          {testing?<Spinner/>:"🔔"} TEST DISCORD
        </button>
        {dscTest&&<span style={{fontSize:10,fontWeight:700,color:dscTest.ok?"#22c55e":"#ef4444"}}>{dscTest.msg}</span>}
      </div>

      {/* Filters */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <input type="text" value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 Tìm đơn..."
          style={{flex:1,minWidth:140,padding:"7px 11px",borderRadius:7,fontSize:11}}/>
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{padding:"7px 10px",borderRadius:7,fontSize:10}}>
          <option value="all">Tất cả</option>
          {STATUS_COLS.map(s=><option key={s} value={s}>{STATUS_LABEL[s]}</option>)}
        </select>
      </div>

      {/* Kanban */}
      <div style={{display:"flex",overflowX:"auto",gap:10,paddingBottom:8}}>
        {STATUS_COLS.map(st=>{
          const col=filtered.filter(o=>o.status===st);
          return(
            <div key={st} style={{minWidth:230,flex:"0 0 230px"}}>
              <div style={{padding:"7px 10px",borderRadius:"8px 8px 0 0",background:`${STATUS_COLOR[st]}18`,
                borderBottom:`2px solid ${STATUS_COLOR[st]}`,display:"flex",justifyContent:"space-between",marginBottom:7}}>
                <span style={{fontSize:9,fontWeight:700,color:STATUS_COLOR[st]}}>{STATUS_LABEL[st]}</span>
                <span style={{background:STATUS_COLOR[st],color:"#0a0714",borderRadius:"50%",width:17,height:17,
                  display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:900}}>{col.length}</span>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:7,maxHeight:"calc(100vh - 320px)",overflowY:"auto"}}>
                {col.length===0?<div style={{fontSize:9,color:"#334155",textAlign:"center",padding:14}}>Trống</div>
                :col.map(o=>{
                  const next=STATUS_NEXT[o.status];
                  const canEdit=["owner","manager","staff"].includes(session.role);
                  return(
                    <div key={o._id} className="gl"
                      onClick={()=>canEdit&&next&&updStatus(o,next)}
                      onTouchStart={()=>{}} // enable active state on iOS
                      style={{borderRadius:8,padding:"9px 11px",position:"relative",
                        cursor:next&&canEdit?"pointer":"default",
                        boxShadow:next&&canEdit?`0 0 0 1px ${STATUS_COLOR[next]}44`:undefined,
                        WebkitTapHighlightColor:"transparent",userSelect:"none"}}>
                      <Corner sz={5} c={STATUS_COLOR[o.status]}/>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                        <span className="tg" style={{fontWeight:900,fontSize:11}}>{o.orderNumber}</span>
                        <span style={{fontSize:8,color:"#475569"}}>{new Date(o.createdAt).toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})}</span>
                      </div>
                      {Array.isArray(o.items)&&o.items.map((it,i)=>(
                        <div key={i} style={{fontSize:9,color:"#94a3b8",lineHeight:1.7}}>
                          {it.qty}x {it.name}{it.sweetness&&<span style={{color:"#475569"}}> · {it.sweetness}</span>}
                        </div>
                      ))}
                      <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}>
                        <span style={{fontSize:9,color:"#64748b"}}>{o.paymentMethod==="cash"?"💵":"🏦"}</span>
                        <span className="tg" style={{fontWeight:900,fontSize:11}}>{vnd(o.total)}</span>
                      </div>
                      {next&&canEdit&&(
                        <div style={{marginTop:6,padding:"6px",borderRadius:5,textAlign:"center",fontSize:9,fontWeight:700,
                          background:`${STATUS_COLOR[next]}18`,color:STATUS_COLOR[next],borderTop:`1px solid ${STATUS_COLOR[next]}30`}}>
                          TAP → {STATUS_LABEL[next]}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {/* Timestamp — từ AFK Control */}
      {ts&&<div style={{textAlign:"center",fontSize:8,color:"#334155",letterSpacing:1}}>↻ {ts.toLocaleTimeString("vi-VN")}</div>}
    </div>
  );
}

// ─── MENU PAGE (ported from AFK Control) ───
function MenuPage({session}){
  const [menuItems,setMenuItems]=useState([]);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(false);
  const [edit,setEdit]=useState(null);
  const [form,setForm]=useState({name:"",price:"",img:"",available:true});
  const [saving,setSaving]=useState(false);
  const [showToast,toastEl]=useToast();
  const [q,setQ]=useState("");
  const canEdit=["owner","manager"].includes(session.role);

  const load=useCallback(async()=>{
    setLoading(true);
    setMenuItems(await fsLoadMenuItems());
    setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const openAdd=()=>{setEdit(null);setForm({name:"",price:"",img:"",available:true});setModal(true);};
  const openEdit=item=>{setEdit(item);setForm({name:item.name,price:String(item.price),img:item.img||"",available:item.available!==false});setModal(true);};

  const save=async()=>{
    if(!form.name||!form.price) return showToast("Cần nhập tên và giá",false);
    setSaving(true);
    try{
      await fsSaveMenuItem({...form,price:Number(form.price),firestoreId:edit?.firestoreId||null});
      await load(); setModal(false); showToast("Đã lưu ✓");
    }catch(e){showToast("Lỗi: "+e.message,false);}
    setSaving(false);
  };

  const del=async item=>{
    if(!confirm('Xoá "'+item.name+'"?')) return;
    try{await fsDelMenuItem(item.firestoreId);await load();showToast("Đã xoá ✓");}
    catch(e){showToast("Lỗi: "+e.message,false);}
  };

  const toggleAvail=async item=>{
    try{await fsSaveMenuItem({...item,available:!item.available});await load();}
    catch(e){showToast("Lỗi: "+e.message,false);}
  };

  const filtered=menuItems.filter(i=>!q||i.name?.toLowerCase().includes(q.toLowerCase()));

  return(
    <div style={{padding:16,display:"flex",flexDirection:"column",gap:12,paddingBottom:40}}>
      {toastEl}

      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div className="tg" style={{fontWeight:900,fontSize:14,letterSpacing:2}}>🍵 MENU</div>
        {canEdit&&(
          <button onClick={openAdd} className="bb" style={{padding:"8px 14px",borderRadius:8,fontSize:10,display:"flex",alignItems:"center",gap:5}}>
            + THÊM MÓN
          </button>
        )}
      </div>

      {/* Search */}
      <input type="text" value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 Tìm món..."
        style={{width:"100%",padding:"7px 11px",borderRadius:7,fontSize:11}}/>

      {/* Quick stats */}
      {!loading&&(
        <div style={{display:"flex",gap:8}}>
          {[["📋 Tổng "+menuItems.length+" món","#9333ea"],["✅ Hiện "+menuItems.filter(i=>i.available!==false).length,"#22c55e"],["⏸ Ẩn "+menuItems.filter(i=>i.available===false).length,"#64748b"]].map(([lb,c])=>(
            <div key={lb} style={{flex:1,padding:"6px 8px",borderRadius:7,background:c+"12",border:"1px solid "+c+"30",textAlign:"center",fontSize:9,color:c,fontWeight:700}}>{lb}</div>
          ))}
        </div>
      )}

      {/* List */}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {loading
          ?<div style={{textAlign:"center",padding:32}}><Spinner/></div>
          :filtered.length===0
            ?<div style={{textAlign:"center",padding:32,color:"#334155",fontSize:10}}>
              {menuItems.length===0?'Chưa có món nào. Bấm "+ THÊM MÓN" để bắt đầu.':"Không tìm thấy."}
             </div>
            :filtered.map(item=>(
              <div key={item._id} className="gl" style={{borderRadius:11,padding:"10px 13px",display:"flex",alignItems:"center",gap:10,
                opacity:item.available===false?.5:1,position:"relative"}}>
                <Corner sz={6} c={item.available===false?"#4b5563":"#9333ea"}/>

                {/* Thumbnail */}
                <div style={{width:54,height:54,borderRadius:9,flexShrink:0,overflow:"hidden",
                  background:"linear-gradient(135deg,"+item.g[0]+","+item.g[1]+")",
                  display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>
                  {item.img
                    ?<img src={item.img} alt={item.name} style={{width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"}/>
                    :item.em}
                </div>

                {/* Info */}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:12,color:"#f1f5f9",marginBottom:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{item.name}</div>
                  <div className="tg" style={{fontWeight:900,fontSize:13}}>{vnd(item.price)}</div>
                </div>

                {/* Actions */}
                {canEdit&&(
                  <div style={{display:"flex",gap:5,flexShrink:0}}>
                    <button onClick={()=>toggleAvail(item)}
                      style={{padding:"5px 9px",borderRadius:6,fontSize:9,fontWeight:700,cursor:"pointer",fontFamily:"monospace",
                        background:item.available!==false?"rgba(34,197,94,.15)":"rgba(100,116,139,.15)",
                        color:item.available!==false?"#22c55e":"#64748b",
                        border:"1px solid "+(item.available!==false?"rgba(34,197,94,.3)":"rgba(100,116,139,.25)")}}>
                      {item.available!==false?"ON":"OFF"}
                    </button>
                    <button onClick={()=>openEdit(item)} className="gb" style={{padding:"5px 9px",borderRadius:6,fontSize:11}}>✏️</button>
                    <button onClick={()=>del(item)} style={{padding:"5px 9px",borderRadius:6,background:"rgba(239,68,68,.1)",color:"#ef4444",border:"1px solid rgba(239,68,68,.25)",cursor:"pointer",fontSize:11}}>🗑️</button>
                  </div>
                )}
              </div>
            ))
        }
      </div>

      {/* Add/Edit Modal */}
      {modal&&(
        <Modal title={edit?"✏️ SỬA MÓN":"➕ THÊM MÓN MỚI"} onClose={()=>setModal(false)}>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <Field label="Tên món">
              <Inp value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="VD: Cafe đen"/>
            </Field>
            <Field label="Giá bán (đồng)">
              <Inp type="number" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} placeholder="25000"/>
            </Field>
            <Field label="URL hình ảnh (tuỳ chọn)">
              <Inp value={form.img} onChange={e=>setForm({...form,img:e.target.value})} placeholder="https://res.cloudinary.com/..."/>
            </Field>
            {form.img&&(
              <div style={{borderRadius:9,overflow:"hidden",aspectRatio:"16/7",background:"#0a0714",border:"1px solid rgba(147,51,234,.2)"}}>
                <img src={form.img} alt="preview" style={{width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"}/>
              </div>
            )}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:"rgba(255,255,255,.03)",borderRadius:8,border:"1px solid rgba(147,51,234,.15)"}}>
              <div>
                <div style={{fontSize:10,fontWeight:700,color:"#f1f5f9"}}>Hiển thị trong menu</div>
                <div style={{fontSize:9,color:"#64748b"}}>Khách hàng có thể thấy và đặt món này</div>
              </div>
              <button onClick={()=>setForm({...form,available:!form.available})}
                style={{padding:"6px 16px",borderRadius:7,fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"monospace",
                  background:form.available?"rgba(34,197,94,.15)":"rgba(100,116,139,.15)",
                  color:form.available?"#22c55e":"#64748b",
                  border:"1px solid "+(form.available?"rgba(34,197,94,.4)":"rgba(100,116,139,.3)")}}>
                {form.available?"✅ Hiện":"⏸ Ẩn"}
              </button>
            </div>
            <button onClick={save} disabled={saving} className="bb gg"
              style={{padding:"13px",borderRadius:10,fontSize:13,letterSpacing:2,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              {saving?<><Spinner/> ĐANG LƯU...</>:"💾 LƯU MÓN"}
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

  const openEdit=e=>{setEdit(e);setForm({name:e.name||"",email:e.email||"",phone:e.phone||"",role:e.role||"staff",active:e.active!==false});setModal(true);};

    if(!form.name||!form.email) return showToast("Cần nhập tên và email",false);

    try{
      const fields={name:toSV(form.name),email:toSV(form.email),phone:toSV(form.phone),role:toSV(form.role),active:toBV(form.active),updatedAt:toSV(new Date().toISOString())};
      if(edit){await fsPatch("employees",edit._id,fields);showToast("Đã cập nhật ✓");}

  const toggleActive=async e=>{
    try{await fsPatch("employees",e._id,{active:toBV(!e.active)});showToast(e.active?"Đã vô hiệu hoá":"Đã kích hoạt");await load();}
    catch(ex){showToast("Lỗi: "+ex.message,false);}

        {isOwner&&<button onClick={openAdd} className="bb" style={{padding:"8px 14px",borderRadius:8,fontSize:10}}>+ THÊM</button>}

      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {loading?<div style={{textAlign:"center",padding:24}}><Spinner/></div>
        :filtered.map(emp=>(
          <div key={emp._id} className="gl" style={{borderRadius:10,padding:"11px 13px",display:"flex",alignItems:"center",gap:10,opacity:emp.active===false?.5:1,position:"relative"}}>
            <Corner sz={6} c={ROLE_COLOR[emp.role]||"#9333ea"}/>
            <div style={{width:38,height:38,borderRadius:"50%",background:(ROLE_COLOR[emp.role]||"#9333ea")+"20",border:"1px solid "+(ROLE_COLOR[emp.role]||"#9333ea")+"40",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>
              {emp.name?.[0]?.toUpperCase()||"?"}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                <span style={{fontWeight:700,fontSize:12,color:"#f1f5f9"}}>{emp.name}</span>
                <Badge color={ROLE_COLOR[emp.role]||"#9333ea"}>{emp.role}</Badge>
              </div>
              <div style={{fontSize:9,color:"#64748b"}}>{emp.email}</div>
              {emp.phone&&<div style={{fontSize:9,color:"#475569"}}>{emp.phone}</div>}

            {isOwner&&(
              <div style={{display:"flex",gap:5}}>
                <button onClick={()=>toggleActive(emp)} style={{padding:"4px 8px",borderRadius:6,fontSize:9,fontWeight:700,cursor:"pointer",fontFamily:"monospace",background:emp.active!==false?"rgba(34,197,94,.15)":"rgba(100,116,139,.15)",color:emp.active!==false?"#22c55e":"#64748b",border:"1px solid "+(emp.active!==false?"rgba(34,197,94,.3)":"rgba(100,116,139,.25)")}}>
                  {emp.active!==false?"ON":"OFF"}
                </button>
                <button onClick={()=>openEdit(emp)} className="gb" style={{padding:"4px 8px",borderRadius:6,fontSize:9}}>✏️</button>

        {!loading&&filtered.length===0&&<div style={{textAlign:"center",padding:24,color:"#334155",fontSize:10}}>Chưa có nhân viên nào</div>}

      {modal&&(

          <div style={{display:"flex",flexDirection:"column",gap:11}}>
            <Field label="Họ tên"><Inp value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Nguyễn Văn A"/></Field>
            <Field label="Email"><Inp type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="staff@afkhub.vn"/></Field>
            <Field label="Số điện thoại"><Inp value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="0901234567"/></Field>
            <Field label="Vai trò">
              <Sel value={form.role} onChange={e=>setForm({...form,role:e.target.value})}>
                {ROLES.map(r=><option key={r} value={r}>{r.toUpperCase()}</option>)}
              </Sel>
            </Field>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:9,color:"#64748b",letterSpacing:1}}>TRẠNG THÁI</span>
              <button onClick={()=>setForm({...form,active:!form.active})} style={{padding:"5px 14px",borderRadius:6,fontSize:9,fontWeight:700,cursor:"pointer",fontFamily:"monospace",background:form.active?"rgba(34,197,94,.15)":"rgba(100,116,139,.15)",color:form.active?"#22c55e":"#64748b",border:"1px solid "+(form.active?"rgba(34,197,94,.3)":"rgba(100,116,139,.3)")}}>
                {form.active?"✅ Hoạt động":"⏸ Vô hiệu"}
              </button>
            </div>
            {!edit&&<div className="glg" style={{borderRadius:8,padding:"9px 12px",fontSize:9,color:"#ca8a04",lineHeight:1.7}}>
              💡 Sau khi thêm, tạo tài khoản Firebase Auth cho nhân viên này, rồi cập nhật UID vào Firestore.
            </div>}
            <button onClick={save} disabled={saving} className="bb gg" style={{padding:"12px",borderRadius:9,fontSize:12,letterSpacing:1,marginTop:4}}>
              {saving?<><Spinner/> ĐANG LƯU...</>:"💾 LƯU"}
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── INGREDIENTS ───
function IngredientsPage({session}){
  const [ingrs,setIngrs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(false);
  const [edit,setEdit]=useState(null);
  const [form,setForm]=useState({name:"",category:"",supplier:"",purchasePrice:0,stockQuantity:0,minimumStock:0,unit:"g"});
  const [saving,setSaving]=useState(false);
  const [showToast,toastEl]=useToast();
  const [q,setQ]=useState("");
  const canEdit=["owner","manager"].includes(session.role);

  const load=useCallback(async()=>{setLoading(true);setIngrs((await fsGet("ingredients")).map(parseDoc).sort((a,b)=>(a.name||"").localeCompare(b.name||"")));setLoading(false);},[]);
  useEffect(()=>{load();},[load]);

  const openAdd=()=>{setEdit(null);setForm({name:"",category:"",supplier:"",purchasePrice:0,stockQuantity:0,minimumStock:0,unit:"g"});setModal(true);};
  const openEdit=i=>{setEdit(i);setForm({name:i.name||"",category:i.category||"",supplier:i.supplier||"",purchasePrice:i.purchasePrice||0,stockQuantity:i.stockQuantity||0,minimumStock:i.minimumStock||0,unit:i.unit||"g"});setModal(true);};

  const save=async()=>{
    if(!form.name) return showToast("Cần nhập tên nguyên liệu",false);
    setSaving(true);
    try{
      const fields={name:toSV(form.name),category:toSV(form.category),supplier:toSV(form.supplier),purchasePrice:toIV(form.purchasePrice),stockQuantity:toIV(form.stockQuantity),minimumStock:toIV(form.minimumStock),unit:toSV(form.unit),updatedAt:toSV(new Date().toISOString())};
      if(edit){await fsPatch("ingredients",edit._id,fields);showToast("Đã cập nhật ✓");}
      else{fields.createdAt=toSV(new Date().toISOString());await fsPost("ingredients",fields);showToast("Đã thêm ✓");}
      await load();setModal(false);
    }catch(e){showToast("Lỗi: "+e.message,false);}
    setSaving(false);
  };

  const del=async i=>{
    if(!confirm('Xoá "'+i.name+'"?')) return;
    try{await fsDel("ingredients",i._id);showToast("Đã xoá ✓");await load();}
    catch(e){showToast("Lỗi: "+e.message,false);}
  };

  const filtered=ingrs.filter(i=>!q||i.name?.toLowerCase().includes(q.toLowerCase())||i.category?.toLowerCase().includes(q.toLowerCase()));

  return(
    <div style={{padding:16,display:"flex",flexDirection:"column",gap:12}}>
      {toastEl}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div className="tg" style={{fontWeight:900,fontSize:14,letterSpacing:2}}>🧪 NGUYÊN LIỆU</div>
        {canEdit&&<button onClick={openAdd} className="bb" style={{padding:"8px 14px",borderRadius:8,fontSize:10}}>+ THÊM</button>}
      </div>
      <input type="text" value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 Tìm nguyên liệu..." style={{width:"100%",padding:"7px 11px",borderRadius:7,fontSize:11}}/>
      {ingrs.filter(i=>i.stockQuantity<=i.minimumStock).length>0&&(
        <div className="glr" style={{borderRadius:8,padding:"9px 12px",position:"relative"}}>
          <Corner sz={6} c="#ef4444"/>
          <div style={{fontSize:9,color:"#ef4444",fontWeight:700}}>⚠️ {ingrs.filter(i=>i.stockQuantity<=i.minimumStock).length} nguyên liệu sắp hết kho</div>
        </div>
      )}
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {loading?<div style={{textAlign:"center",padding:24}}><Spinner/></div>
        :filtered.map(i=>{

            <div key={i._id} className="gl" style={{borderRadius:10,padding:"10px 12px",position:"relative",borderColor:low?"rgba(239,68,68,.35)":"rgba(147,51,234,.2)"}}>

                  <div style={{fontSize:9,color:"#64748b",marginBottom:2}}>
                    {i.category&&<span className="tp">{i.category} · </span>}

                  <div style={{display:"flex",gap:12,fontSize:9}}>
                    <span style={{color:"#94a3b8"}}>Tồn: <strong style={{color:low?"#ef4444":"#22c55e"}}>{i.stockQuantity} {i.unit}</strong></span>
                    <span style={{color:"#64748b"}}>Min: {i.minimumStock} {i.unit}</span>

      </div>
      {modal&&(

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <Field label="Danh mục"><Inp value={form.category} onChange={e=>setForm({...form,category:e.target.value})} placeholder="Coffee"/></Field>
              <Field label="Đơn vị"><Sel value={form.unit} onChange={e=>setForm({...form,unit:e.target.value})}>{UNITS.map(u=><option key={u} value={u}>{u}</option>)}</Sel></Field>
            </div>
            <Field label="Nhà cung cấp"><Inp value={form.supplier} onChange={e=>setForm({...form,supplier:e.target.value})} placeholder="Trung Nguyên"/></Field>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
              <Field label="Giá mua (đ)"><Inp type="number" value={form.purchasePrice} onChange={e=>setForm({...form,purchasePrice:e.target.value})}/></Field>
              <Field label="Tồn kho"><Inp type="number" value={form.stockQuantity} onChange={e=>setForm({...form,stockQuantity:e.target.value})}/></Field>

            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── RECIPES ───
function RecipesPage({session}){
  const [recipes,setRecipes]=useState([]);
  const [menu,setMenu]=useState([]);
  const [ingrs,setIngrs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(false);
  const [edit,setEdit]=useState(null);
  const [selProd,setSelProd]=useState("");
  const [rIngrs,setRIngrs]=useState([]);
  const [saving,setSaving]=useState(false);
  const [showToast,toastEl]=useToast();
  const canEdit=["owner","manager"].includes(session.role);

  const load=useCallback(async()=>{
    setLoading(true);
    const[rD,mD,iD]=await Promise.all([fsGet("recipes"),fsGet("menu"),fsGet("ingredients")]);
    setRecipes(rD.map(parseDoc));
    setMenu(mD.map(d=>{const p=parseDoc(d);return{...p,price:p.sellPrice||p.price||0};}));
    setIngrs(iD.map(parseDoc));
    setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const openAdd=()=>{setEdit(null);setSelProd("");setRIngrs([]);setModal(true);};
  const openEdit=r=>{setEdit(r);setSelProd(r.productId||"");setRIngrs(Array.isArray(r.ingredients)?r.ingredients.map(i=>({...i})):[]);setModal(true);};
  const addIngr=()=>setRIngrs(p=>[...p,{ingredientId:"",ingredientName:"",quantity:0,unit:"g",cost:0}]);
  const updIngr=(idx,field,val)=>setRIngrs(p=>p.map((i,j)=>{
    if(j!==idx) return i;
    const u={...i,[field]:val};
    if(field==="ingredientId"){const f=ingrs.find(x=>x._id===val);if(f){u.ingredientName=f.name;u.unit=f.unit||"g";u.cost=f.purchasePrice||0;}}
    return u;
  }));
  const remIngr=idx=>setRIngrs(p=>p.filter((_,j)=>j!==idx));

  const totalCost=useMemo(()=>rIngrs.reduce((s,i)=>s+(parseFloat(i.cost)||0)*(parseFloat(i.quantity)||0),0),[rIngrs]);
  const sellPrice=useMemo(()=>{const p=menu.find(m=>m._id===selProd);return p?.price||0;},[menu,selProd]);
  const profit=sellPrice-totalCost;
  const margin=sellPrice?Math.round(profit/sellPrice*100):0;

  const save=async()=>{
    if(!selProd) return showToast("Chọn sản phẩm",false);
    const prod=menu.find(m=>m._id===selProd);
    if(!prod) return;
    setSaving(true);
    try{
      const iArr=rIngrs.map(i=>({ingredientId:String(i.ingredientId||""),ingredientName:String(i.ingredientName||""),quantity:parseFloat(i.quantity)||0,unit:String(i.unit||"g"),cost:parseFloat(i.cost)||0}));
      const fields={
        productId:toSV(selProd),productName:toSV(prod.name||""),
        ingredients:{arrayValue:{values:iArr.map(i=>({mapValue:{fields:{ingredientId:toSV(i.ingredientId),ingredientName:toSV(i.ingredientName),quantity:toFV(i.quantity),unit:toSV(i.unit),cost:toFV(i.cost)}}}))}},
        totalCost:toFV(totalCost),sellPrice:toIV(sellPrice),estimatedProfit:toFV(profit),margin:toIV(margin),
        updatedAt:toSV(new Date().toISOString()),
      };
      if(edit){await fsPatch("recipes",edit._id,fields);showToast("Đã cập nhật ✓");}
      else{fields.createdAt=toSV(new Date().toISOString());await fsPost("recipes",fields);showToast("Đã tạo ✓");}
      await load();setModal(false);
    }catch(e){showToast("Lỗi: "+e.message,false);}
    setSaving(false);
  };

  const del=async r=>{
    if(!confirm('Xoá "'+r.productName+'"?')) return;
    try{await fsDel("recipes",r._id);showToast("Đã xoá ✓");await load();}
    catch(e){showToast("Lỗi: "+e.message,false);}
  };

  return(
    <div style={{padding:16,display:"flex",flexDirection:"column",gap:12}}>
      {toastEl}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div className="tg" style={{fontWeight:900,fontSize:14,letterSpacing:2}}>📖 CÔNG THỨC</div>
        {canEdit&&<button onClick={openAdd} className="bb" style={{padding:"8px 14px",borderRadius:8,fontSize:10}}>+ THÊM</button>}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {loading?<div style={{textAlign:"center",padding:24}}><Spinner/></div>
        :recipes.length===0?<div style={{textAlign:"center",padding:24,color:"#334155",fontSize:10}}>Chưa có công thức nào</div>
        :recipes.map(r=>{
          const m=parseFloat(r.margin)||0;
          return(
            <div key={r._id} className="gl" style={{borderRadius:10,padding:"11px 13px",position:"relative"}}>
              <Corner sz={6}/>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div>
                  <div style={{fontWeight:700,fontSize:12,color:"#f1f5f9",marginBottom:3}}>{r.productName}</div>
                  <div style={{display:"flex",gap:8,fontSize:9}}>
                    <span style={{color:"#64748b"}}>Chi phí: <strong style={{color:"#f97316"}}>{vnd(r.totalCost)}</strong></span>
                    <span style={{color:"#64748b"}}>Bán: <strong style={{color:"#eab308"}}>{vnd(r.sellPrice)}</strong></span>
                    <span style={{color:"#64748b"}}>Margin: <strong style={{color:m>30?"#22c55e":"#f97316"}}>{m}%</strong></span>
                  </div>
                </div>
                {canEdit&&(
                  <div style={{display:"flex",gap:5}}>
                    <button onClick={()=>openEdit(r)} className="gb" style={{padding:"4px 8px",borderRadius:6,fontSize:9}}>✏️</button>
                    <button onClick={()=>del(r)} className="rb" style={{padding:"4px 8px",borderRadius:6,fontSize:9}}>🗑️</button>
                  </div>
                )}
              </div>
              {Array.isArray(r.ingredients)&&r.ingredients.length>0&&(
                <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                  {r.ingredients.map((i,idx)=>(
                    <span key={idx} style={{background:"rgba(147,51,234,.12)",border:"1px solid rgba(147,51,234,.2)",borderRadius:4,padding:"2px 7px",fontSize:8,color:"#a855f7"}}>
                      {i.ingredientName} {i.quantity}{i.unit}
                    </span>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
      {modal&&(
        <Modal title={edit?"✏️ SỬA CÔNG THỨC":"➕ THÊM CÔNG THỨC"} onClose={()=>setModal(false)} wide>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <Field label="Sản phẩm">
              <Sel value={selProd} onChange={e=>setSelProd(e.target.value)}>
                <option value="">-- Chọn sản phẩm --</option>
                {menu.map(m=><option key={m._id} value={m._id}>{m.name} · {vnd(m.price)}</option>)}
              </Sel>
            </Field>
            {selProd&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                {[["CHI PHÍ",vnd(totalCost),"#f97316"],["LỢI NHUẬN",vnd(profit),profit>0?"#22c55e":"#ef4444"],["MARGIN",margin+"%","#eab308"]].map(([lb,v,c])=>(
                  <div key={lb} className="gl" style={{borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:8,color:"#64748b",marginBottom:2}}>{lb}</div>
                    <div style={{fontWeight:900,fontSize:13,color:c}}>{v}</div>
                  </div>
                ))}
              </div>
            )}
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontSize:9,color:"#64748b",letterSpacing:1}}>NGUYÊN LIỆU</span>
                <button onClick={addIngr} className="gb" style={{padding:"4px 10px",borderRadius:6,fontSize:9}}>+ Thêm</button>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:7}}>
                {rIngrs.map((ri,idx)=>(
                  <div key={idx} className="gl" style={{borderRadius:8,padding:"9px 10px",display:"flex",gap:7,alignItems:"center"}}>
                    <select value={ri.ingredientId} onChange={e=>updIngr(idx,"ingredientId",e.target.value)}
                      style={{flex:2,padding:"6px 8px",borderRadius:6,fontSize:10,background:"rgba(255,255,255,.05)",border:"1px solid rgba(147,51,234,.3)",color:"#fff",fontFamily:"monospace"}}>
                      <option value="">-- Nguyên liệu --</option>
                      {ingrs.map(i=><option key={i._id} value={i._id}>{i.name}</option>)}
                    </select>
                    <input type="number" value={ri.quantity} onChange={e=>updIngr(idx,"quantity",e.target.value)} style={{width:55,padding:"6px 8px",borderRadius:6,fontSize:10}} placeholder="Qty"/>
                    <span style={{fontSize:9,color:"#64748b",whiteSpace:"nowrap"}}>{ri.unit}</span>
                    <button onClick={()=>remIngr(idx)} className="rb" style={{padding:"4px 7px",borderRadius:5,fontSize:9}}>✕</button>

// ─── INVENTORY LOGS ───
function InventoryPage({session}){
  const [logs,setLogs]=useState([]);
  const [ingrs,setIngrs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({ingredientId:"",type:"import",quantity:0,reason:""});
  const [saving,setSaving]=useState(false);
  const [showToast,toastEl]=useToast();
  const canEdit=["owner","manager"].includes(session.role);
  const TC={import:"#22c55e",usage:"#f97316",waste:"#ef4444",manual_adjustment:"#a855f7"};

  const load=useCallback(async()=>{
    setLoading(true);
    const[lD,iD]=await Promise.all([fsGet("stock_logs"),fsGet("ingredients")]);
    setLogs(lD.map(parseDoc).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)));
    setIngrs(iD.map(parseDoc));
    setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const save=async()=>{
    if(!form.ingredientId||!form.quantity) return showToast("Cần chọn nguyên liệu và số lượng",false);
    setSaving(true);
    try{
      const ingr=ingrs.find(i=>i._id===form.ingredientId);
      const qty=parseFloat(form.quantity)||0;
      const before=ingr?.stockQuantity||0;
      let after=before;
      if(form.type==="import") after=before+qty;
      else if(form.type==="usage"||form.type==="waste") after=Math.max(0,before-qty);
      else after=qty;
      await fsPost("stock_logs",{ingredientId:toSV(form.ingredientId),ingredientName:toSV(ingr?.name||""),type:toSV(form.type),quantity:toFV(qty),beforeStock:toFV(before),afterStock:toFV(after),reason:toSV(form.reason),createdBy:toSV(session.name||""),createdAt:toSV(new Date().toISOString())});
      await fsPatch("ingredients",form.ingredientId,{stockQuantity:toFV(after),updatedAt:toSV(new Date().toISOString())});
      showToast("Đã ghi nhận ✓");
      await load();setModal(false);
    }catch(e){showToast("Lỗi: "+e.message,false);}
    setSaving(false);
  };

  return(
    <div style={{padding:16,display:"flex",flexDirection:"column",gap:12}}>
      {toastEl}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div className="tg" style={{fontWeight:900,fontSize:14,letterSpacing:2}}>📦 NHẬT KÝ KHO</div>
        {canEdit&&<button onClick={()=>{setForm({ingredientId:"",type:"import",quantity:0,reason:""});setModal(true);}} className="bb" style={{padding:"8px 14px",borderRadius:8,fontSize:10}}>+ GHI NHẬN</button>}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {loading?<div style={{textAlign:"center",padding:24}}><Spinner/></div>
        :logs.length===0?<div style={{textAlign:"center",padding:24,color:"#334155",fontSize:10}}>Chưa có nhật ký nào</div>
        :logs.slice(0,50).map(l=>{
          const tc=TC[l.type]||"#64748b";
          return(
            <div key={l._id} className="gl" style={{borderRadius:9,padding:"10px 12px",position:"relative",display:"flex",gap:10,alignItems:"center"}}>
              <Corner sz={5} c={tc}/>
              <div style={{width:32,height:32,borderRadius:8,background:tc+"18",border:"1px solid "+tc+"30",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>
                {l.type==="import"?"📥":l.type==="usage"?"🔥":l.type==="waste"?"🗑️":"✏️"}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                  <span style={{fontWeight:700,fontSize:11,color:"#f1f5f9"}}>{l.ingredientName}</span>
                  <Badge color={tc}>{LOG_LABEL[l.type]||l.type}</Badge>
                </div>
                <div style={{fontSize:9,color:"#64748b"}}>
                  {l.beforeStock} → <strong style={{color:tc}}>{l.afterStock}</strong>{l.reason&&" · "+l.reason}
                </div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontSize:10,fontWeight:700,color:tc}}>{l.type==="import"?"+":"-"}{l.quantity}</div>
                <div style={{fontSize:8,color:"#475569"}}>{l.createdBy}</div>
                <div style={{fontSize:7,color:"#334155"}}>{new Date(l.createdAt).toLocaleDateString("vi-VN")}</div>
              </div>
            </div>
          );
        })}
      </div>
      {modal&&(
        <Modal title="📦 GHI NHẬN KHO" onClose={()=>setModal(false)}>
          <div style={{display:"flex",flexDirection:"column",gap:11}}>
            <Field label="Nguyên liệu">
              <Sel value={form.ingredientId} onChange={e=>setForm({...form,ingredientId:e.target.value})}>
                <option value="">-- Chọn nguyên liệu --</option>
                {ingrs.map(i=><option key={i._id} value={i._id}>{i.name} (tồn: {i.stockQuantity} {i.unit})</option>)}
              </Sel>
            </Field>
            <Field label="Loại giao dịch">
              <Sel value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
                {LOG_TYPES.map(t=><option key={t} value={t}>{LOG_LABEL[t]}</option>)}
              </Sel>
            </Field>
            <Field label="Số lượng"><Inp type="number" value={form.quantity} onChange={e=>setForm({...form,quantity:e.target.value})}/></Field>
            <Field label="Lý do (tuỳ chọn)"><Inp value={form.reason} onChange={e=>setForm({...form,reason:e.target.value})} placeholder="Nhập hàng từ nhà cung cấp..."/></Field>
            <button onClick={save} disabled={saving} className="bb gg" style={{padding:"12px",borderRadius:9,fontSize:12,letterSpacing:1,marginTop:4}}>
              {saving?<><Spinner/> ĐANG LƯU...</>:"💾 XÁC NHẬN"}

// ─── ANALYTICS ───
function AnalyticsPage(){
  const [orders,setOrders]=useState([]);
  const [recipes,setRecipes]=useState([]);
  const [loading,setLoading]=useState(true);
  const [period,setPeriod]=useState("today");

  const load=useCallback(async()=>{
    setLoading(true);
    const[oD,rD]=await Promise.all([fsGet("orders"),fsGet("recipes")]);
    setOrders(oD.map(parseDoc));setRecipes(rD.map(parseDoc));
    setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const filtered=useMemo(()=>{
    const now=new Date();
    return orders.filter(o=>{
      const d=new Date(o.createdAt);
      if(period==="today") return d.toDateString()===now.toDateString();
      if(period==="week"){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w;}
      if(period==="month"){const m=new Date(now);m.setDate(m.getDate()-30);return d>=m;}
      return true;
    }).filter(o=>o.status!=="pending");
  },[orders,period]);

  const revenue=filtered.reduce((s,o)=>s+(o.total||0),0);
  const avgOrder=filtered.length?revenue/filtered.length:0;
  const prodMap={};filtered.forEach(o=>{if(!Array.isArray(o.items))return;o.items.forEach(i=>{if(i.name)prodMap[i.name]=(prodMap[i.name]||0)+(i.qty||1)*(i.price||0);});});
  const topProds=Object.entries(prodMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const itemMap={};filtered.forEach(o=>{if(!Array.isArray(o.items))return;o.items.forEach(i=>{if(i.name)itemMap[i.name]=(itemMap[i.name]||0)+(i.qty||1);});});
  const topItems=Object.entries(itemMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const cash=filtered.filter(o=>o.paymentMethod==="cash").length;
  const bank=filtered.filter(o=>o.paymentMethod==="bank_transfer").length;
  const totalCost=filtered.reduce((s,o)=>{if(!Array.isArray(o.items))return s;return s+o.items.reduce((ss,i)=>{const r=recipes.find(rc=>rc.productName===i.name);return ss+(r?.totalCost||0)*(i.qty||1);},0);},0);
  const profit=revenue-totalCost;
  const hourMap=new Array(24).fill(0);filtered.forEach(o=>{const h=new Date(o.createdAt).getHours();hourMap[h]++;});
  const maxH=Math.max(...hourMap,1);

  return(
    <div style={{padding:16,display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div className="tg" style={{fontWeight:900,fontSize:14,letterSpacing:2}}>📈 PHÂN TÍCH</div>
        <div style={{display:"flex",gap:5}}>
          {[["today","Hôm nay"],["week","7 ngày"],["month","30 ngày"],["all","Tất cả"]].map(([v,l])=>(
            <button key={v} onClick={()=>setPeriod(v)} style={{padding:"5px 10px",borderRadius:6,fontSize:9,fontWeight:700,cursor:"pointer",fontFamily:"monospace",background:period===v?"linear-gradient(135deg,#eab308,#f59e0b)":"rgba(255,255,255,.04)",color:period===v?"#0a0714":"#64748b",border:period===v?"none":"1px solid rgba(147,51,234,.2)"}}>
              {l}
            </button>
          ))}
        </div>
      </div>
      {loading?<div style={{textAlign:"center",padding:40}}><Spinner/></div>:(
        <>
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
            <StatCard label="Doanh thu" value={vnd(revenue)} sub={filtered.length+" đơn"} icon="💰"/>
            <StatCard label="Lợi nhuận ước tính" value={vnd(profit)} sub={"Margin: "+pct(profit,revenue)+"%"} color="#22c55e" icon="📊"/>
            <StatCard label="Trung bình/đơn" value={vnd(Math.round(avgOrder))} color="#a855f7" icon="🧾"/>
            <StatCard label="Chi phí NL" value={vnd(Math.round(totalCost))} color="#f97316" icon="🧪"/>
          </div>
          <div className="gl" style={{borderRadius:10,padding:"12px 14px",position:"relative"}}>
            <Corner sz={7}/>
            <div style={{fontSize:9,color:"#64748b",letterSpacing:2,marginBottom:10}}>GIỜ CAO ĐIỂM</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:3,height:50}}>
              {hourMap.map((v,h)=>(
                <div key={h} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                  <div style={{width:"100%",borderRadius:2,height:Math.round(v/maxH*44)+"px",minHeight:v>0?3:1,background:v>0?"linear-gradient(to top,#eab308,#f59e0b)":"rgba(255,255,255,.05)"}}/>
                  {(h%6===0)&&<span style={{fontSize:6,color:"#334155"}}>{h}h</span>}
                </div>
              ))}
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div className="gl" style={{borderRadius:10,padding:"11px 13px",position:"relative"}}>
              <Corner sz={6}/>
              <div style={{fontSize:9,color:"#64748b",letterSpacing:1,marginBottom:9}}>TOP DOANH THU</div>
              {topProds.length===0?<div style={{fontSize:9,color:"#334155"}}>Chưa có dữ liệu</div>
              :topProds.map(([name,rev],i)=>(
                <div key={name} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderBottom:"1px solid rgba(147,51,234,.07)"}}>
                  <div style={{display:"flex",alignItems:"center",gap:5}}>
                    <span style={{fontSize:8,color:"#eab308",fontWeight:900}}>#{i+1}</span>
                    <span style={{fontSize:9,color:"#94a3b8",whiteSpace:"nowrap",overflow:"hidden",maxWidth:90,textOverflow:"ellipsis"}}>{name}</span>
                  </div>
                  <span style={{fontSize:9,fontWeight:700,color:"#eab308"}}>{vnd(rev)}</span>
                </div>
              ))}
            </div>
            <div className="gl" style={{borderRadius:10,padding:"11px 13px",position:"relative"}}>
              <Corner sz={6}/>
              <div style={{fontSize:9,color:"#64748b",letterSpacing:1,marginBottom:9}}>TOP SỐ LƯỢNG</div>
              {topItems.length===0?<div style={{fontSize:9,color:"#334155"}}>Chưa có dữ liệu</div>
              :topItems.map(([name,cnt],i)=>(
                <div key={name} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderBottom:"1px solid rgba(147,51,234,.07)"}}>
                  <div style={{display:"flex",alignItems:"center",gap:5}}>
                    <span style={{fontSize:8,color:"#a855f7",fontWeight:900}}>#{i+1}</span>
                    <span style={{fontSize:9,color:"#94a3b8",whiteSpace:"nowrap",overflow:"hidden",maxWidth:90,textOverflow:"ellipsis"}}>{name}</span>
                  </div>
                  <span style={{fontSize:9,fontWeight:700,color:"#a855f7"}}>{cnt} ly</span>
                </div>
              ))}
            </div>
          </div>
          <div className="gl" style={{borderRadius:10,padding:"11px 13px",position:"relative"}}>
            <Corner sz={6}/>
            <div style={{fontSize:9,color:"#64748b",letterSpacing:1,marginBottom:9}}>PHƯƠNG THỨC THANH TOÁN</div>
            <div style={{display:"flex",gap:10}}>
              {[["💵 Tiền mặt",cash,"#eab308"],["🏦 Chuyển khoản",bank,"#a855f7"]].map(([lb,cnt,c])=>(
                <div key={lb} style={{flex:1,textAlign:"center",padding:"10px",background:c+"10",borderRadius:8,border:"1px solid "+c+"25"}}>
                  <div style={{fontSize:16,marginBottom:4}}>{lb.split(" ")[0]}</div>
                  <div style={{fontWeight:900,fontSize:16,color:c}}>{cnt}</div>
                  <div style={{fontSize:8,color:"#64748b"}}>{lb.split(" ").slice(1).join(" ")}</div>
                  <div style={{fontSize:8,color:c}}>{filtered.length?pct(cnt,filtered.length):0}%</div>
                </div>
              ))}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function ReportsPage(){
  const [orders,setOrders]=useState([]);
  const [reports,setReports]=useState([]);
  const [loading,setLoading]=useState(true);
  const [generating,setGenerating]=useState(false);
  const [showToast,toastEl]=useToast();

  const load=useCallback(async()=>{
    setLoading(true);
    const[oD,rD]=await Promise.all([fsGet("orders"),fsGet("dailyReports")]);
    setOrders(oD.map(parseDoc));
    setReports(rD.map(parseDoc).sort((a,b)=>new Date(b.date)-new Date(a.date)));
    setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const genReport=async()=>{
    setGenerating(true);
    try{
      const today=new Date(); const todayStr=today.toISOString().split("T")[0];
      const todayOrders=orders.filter(o=>new Date(o.createdAt).toDateString()===today.toDateString()&&o.status!=="pending");
      const revenue=todayOrders.reduce((s,o)=>s+(o.total||0),0);
      const itemMap={};todayOrders.forEach(o=>{if(Array.isArray(o.items))o.items.forEach(i=>{if(i.name)itemMap[i.name]=(itemMap[i.name]||0)+(i.qty||1);});});
      const topProducts=Object.entries(itemMap).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([name,qty])=>({name,qty}));
      await fsPost("dailyReports",{
        date:toSV(todayStr),revenue:toIV(revenue),orderCount:toIV(todayOrders.length),
        topProducts:{arrayValue:{values:topProducts.map(p=>({mapValue:{fields:{name:toSV(p.name),qty:toIV(p.qty)}}}))}},
        createdAt:toSV(new Date().toISOString()),
      });
      showToast("Đã tạo báo cáo ngày ✓");await load();
    }catch(e){showToast("Lỗi: "+e.message,false);}

        <button onClick={genReport} disabled={generating} className="bb" style={{padding:"8px 14px",borderRadius:8,fontSize:10}}>
          {generating?<Spinner/>:"📊 TẠO BÁO CÁO HÔM NAY"}
        </button>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {loading?<div style={{textAlign:"center",padding:24}}><Spinner/></div>
        :reports.length===0?<div style={{textAlign:"center",padding:24,color:"#334155",fontSize:10}}>Chưa có báo cáo. Nhấn "Tạo báo cáo" để bắt đầu.</div>
        :reports.map(r=>(
          <div key={r._id} className="gl" style={{borderRadius:10,padding:"11px 13px",position:"relative"}}>
            <Corner sz={6}/>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:7}}>
              <div>
                <div className="tg" style={{fontWeight:900,fontSize:12}}>{r.date}</div>
                <div style={{fontSize:8,color:"#475569"}}>{new Date(r.createdAt).toLocaleTimeString("vi-VN")}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div className="tg" style={{fontWeight:900,fontSize:14}}>{vnd(r.revenue)}</div>
                <div style={{fontSize:9,color:"#64748b"}}>{r.orderCount} đơn</div>
              </div>
            </div>
            {Array.isArray(r.topProducts)&&r.topProducts.length>0&&(
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                {r.topProducts.map((p,i)=>(
                  <span key={i} style={{background:"rgba(147,51,234,.1)",border:"1px solid rgba(147,51,234,.2)",borderRadius:4,padding:"2px 7px",fontSize:8,color:"#a855f7"}}>
                    {p.name}: {p.qty}
