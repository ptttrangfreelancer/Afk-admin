*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0714;font-family:'Courier New',monospace;overflow-x:hidden;color:#fff}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0a0714}::-webkit-scrollbar-thumb{background:#9333ea;border-radius:2px}
@keyframes gG{0%,100%{box-shadow:0 0 8px rgba(234,179,8,.5),0 0 20px rgba(234,179,8,.2)}50%{box-shadow:0 0 18px rgba(234,179,8,.9),0 0 45px rgba(234,179,8,.4)}}
@keyframes gP{0%,100%{box-shadow:0 0 8px rgba(147,51,234,.4)}50%{box-shadow:0 0 20px rgba(147,51,234,.8)}}
@keyframes fU{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes sU{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes sL{0%{transform:translateY(-100vh)}100%{transform:translateY(100vh)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sp{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes cB{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.gg{animation:gG 2s ease-in-out infinite}
.gp{animation:gP 2s ease-in-out infinite}
.fu{animation:fU .45s ease forwards}
.su{animation:sU .35s cubic-bezier(.16,1,.3,1) forwards}
.fl{animation:fl 3.5s ease-in-out infinite}
.sp{animation:sp 1s linear infinite}
.ch{animation:cB .5s ease forwards}
.hv{transition:transform .25s,box-shadow .25s}
.hv:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(147,51,234,.35),0 0 0 1px rgba(234,179,8,.15)}
.gl{background:rgba(255,255,255,.04);backdrop-filter:blur(12px);border:1px solid rgba(147,51,234,.2)}
.glg{background:rgba(234,179,8,.06);backdrop-filter:blur(12px);border:1px solid rgba(234,179,8,.25)}
.cy{background-image:linear-gradient(rgba(147,51,234,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(147,51,234,.04) 1px,transparent 1px);background-size:40px 40px}
.tg{color:#eab308;text-shadow:0 0 12px rgba(234,179,8,.55)}
.tp{color:#a855f7}
input,select{background:rgba(255,255,255,.05);border:1px solid rgba(147,51,234,.3);color:#fff;outline:none;font-family:'Courier New',monospace;transition:border-color .2s}
input:focus,select:focus{border-color:#9333ea;box-shadow:0 0 12px rgba(147,51,234,.2)}
.bb{background:linear-gradient(135deg,#eab308,#f59e0b);color:#0a0714;font-weight:900;border:none;cursor:pointer;transition:all .2s;font-family:'Courier New',monospace;letter-spacing:2px;text-transform:uppercase;position:relative;overflow:hidden}
.bb::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,rgba(255,255,255,.12),transparent);transform:rotate(45deg) translateX(-200%);transition:transform .5s}
.bb:hover::after{transform:rotate(45deg) translateX(200%)}
.bb:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(234,179,8,.45)}
.bb:active{transform:translateY(0)}
.gb{background:transparent;border:1px solid rgba(147,51,234,.45);color:#a855f7;cursor:pointer;transition:all .2s;font-family:'Courier New',monospace}
.gb:hover{border-color:#a855f7;background:rgba(147,51,234,.1);box-shadow:0 0 14px rgba(147,51,234,.2)}
  </style>

function detectCat(item) {
  if (item.cat) return item.cat;
  if (item.category) return item.category;
  const n = (item.name || "").toLowerCase();
  if (n.includes("matcha"))                              return "🍵 Matcha";
  if (n.includes("trà sữa") || n.includes("tra sua"))  return "🧋 Trà sữa";
  if (n.includes("trà") || n.includes("tra "))          return "🍊 Trà";
  if (n.includes("cafe") || n.includes("bạc xỉu") || n.includes("bac xiu")) return "☕ Cà phê";
  return "🥤 Khác";
}

function groupMenu(items) {
  const map = {};
  items.forEach(item => {
    const c = detectCat(item);
    if (!map[c]) map[c] = [];
    map[c].push(item);
  });
  return CAT_ORDER.filter(c => map[c]).map(c => ({ cat:c, items:map[c] }));
}

function toFV(v) {
  if (typeof v === "number") return { integerValue: String(v) };
  if (typeof v === "string") return { stringValue: v };
  if (Array.isArray(v)) return {
    arrayValue: {
      values: v.map(i => ({
        mapValue: { fields: {
          id:        { stringValue: i.id        || "" },
          name:      { stringValue: i.name      || "" },
          em:        { stringValue: i.em        || "" },
          price:     { integerValue: String(i.price || 0) },
          qty:       { integerValue: String(i.qty   || 1) },
          sweetness: { stringValue: i.sweetness || "" },
          size:      { stringValue: i.size      || "" },
        }}
      }))
    }
  };
  return { stringValue: String(v) };
}

const ST = {
  async getCounter() {
    try {
      const res  = await fetch(`${FB}/counters/orderCounter?key=${FBKEY}`);
      const data = await res.json();
      return parseInt(data.fields?.value?.integerValue || 100);
    } catch { return 100; }
  },
  async incCounter() {
    const n = (await this.getCounter()) + 1;
    try {
      await fetch(`${FB}/counters/orderCounter?updateMask.fieldPaths=value&key=${FBKEY}`, {
        method:  "PATCH",
        headers: { "Content-Type":"application/json" },
        body:    JSON.stringify({ fields: { value: { integerValue: String(n) } } }),
      });
    } catch {}
    return n;
  },
  async postOrder(order) {
    try {
      const fields = {};
      Object.entries(order).forEach(([k,v]) => { fields[k] = toFV(v); });
      await fetch(`${FB}/orders?key=${FBKEY}`, {
        method:  "POST",
        headers: { "Content-Type":"application/json" },
        body:    JSON.stringify({ fields }),
      });
    } catch(e) { console.error("postOrder:", e); }
  },
};

  const lines = order.items.map(i => i.qty+"x "+i.name+(i.size?" ["+i.size+"]":"")+(i.sweetness?" ("+i.sweetness+")":"")).join("\n");
  const pay   = order.paymentMethod === "cash" ? "💵 Tiền mặt" : "🏦 Chuyển khoản";
  const kh    = order.customerName ? "👤 **"+order.customerName+"**"+(order.customerPhone?" · "+order.customerPhone:"")+"\n" : "";
  const note  = order.note ? "📝 "+order.note+"\n" : "";
  const msg   = "⚡ **ĐƠN MỚI — "+order.orderNumber+"**\n"+kh+note+"```\n"+lines+"\n```\n💰 **"+vnd(order.total)+"** · "+pay;
  try {
    const res = await fetch(DSC, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({content:msg}) });
    return { ok:res.ok, status:res.status };
  } catch(e) {
    return { ok:false, error:e.message };
  }
}

async function fsLoadMenu() {
  try {
    const res  = await fetch(`${FB}/menu?key=${FBKEY}&pageSize=100`);
    const data = await res.json();
    if (!data.documents || !data.documents.length) return [];
    return data.documents
      .map(doc => {
        const f  = doc.fields || {};
        const id = doc.name.split("/").pop();
        return {
          firestoreId: id,
          id,
          name:      f.name?.stringValue      || "",
          price:     parseInt(f.sellPrice?.integerValue || 0),
          img:       f.imageUrl?.stringValue  || "",
          available: f.available?.booleanValue !== false,
          g:         ["#2d1200","#8B4513"],
          em:        "☕",
        };
      })
      .filter(i => i.available !== false && i.name);
  } catch(e) { console.warn("fsLoadMenu:", e.message); return []; }
}

// ─────────────────────────────────────────────
// VOUCHER HELPERS
// ─────────────────────────────────────────────
function parseVoucher(doc) {
  const f = doc.fields || {};
  return {
    firestoreId:  doc.name.split("/").pop(),
    code:         (f.code?.stringValue        || "").toUpperCase(),
    discount:     parseInt(f.discount?.integerValue  || 0),
    discountType: f.discountType?.stringValue || "fixed",
    customerName: f.customerName?.stringValue || "",
    phone:        f.phone?.stringValue        || "",
    maxUses:      parseInt(f.maxUses?.integerValue    || 1),
    usedCount:    parseInt(f.usedCount?.integerValue  || 0),
    active:       f.active?.booleanValue !== false,
    expireDate:   f.expireDate?.stringValue   || "",
    note:         f.note?.stringValue         || "",
    createdAt:    f.createdAt?.stringValue    || "",
  };
}

async function fsGetVoucherByCode(code) {
  try {
    const res  = await fetch(`${FB}/vouchers?key=${FBKEY}&pageSize=200`);
    const data = await res.json();
    if (!data.documents) return null;
    const doc = data.documents.find(
      d => (d.fields?.code?.stringValue || "").toUpperCase() === code.toUpperCase().trim()
    );
    return doc ? parseVoucher(doc) : null;
  } catch(e) { return null; }
}

async function fsIncrementVoucherUse(firestoreId, currentUsed) {
  await fetch(`${FB}/vouchers/${firestoreId}?updateMask.fieldPaths=usedCount&key=${FBKEY}`, {
    method: "PATCH", headers: { "Content-Type":"application/json" },
    body: JSON.stringify({ fields: { usedCount: { integerValue: String(currentUsed + 1) } } }),
  });
}

function applyVoucher(voucher, cartTotal) {
  if (!voucher)                   return { valid:false, error:"Mã không tồn tại",          amount:0 };
  if (!voucher.active)            return { valid:false, error:"Mã đã bị vô hiệu hoá",      amount:0 };
  if (voucher.expireDate && new Date(voucher.expireDate) < new Date())
                                  return { valid:false, error:"Mã đã hết hạn",              amount:0 };
  if (voucher.usedCount >= voucher.maxUses)
                                  return { valid:false, error:"Mã đã dùng hết lượt",        amount:0 };
  const amount = voucher.discountType === "percent"
    ? Math.round(cartTotal * voucher.discount / 100)
    : Math.min(voucher.discount, cartTotal);
  return { valid:true, error:null, amount };
}

              color:payM===v?"#0a0714":"#94a3b8",border:payM===v?"none":"1px solid rgba(147,51,234,.2)",
              boxShadow:payM===v?"0 0 20px rgba(234,179,8,.35)":"none"}}>

    <div style={{minHeight:"100vh",background:"#0a0714",paddingBottom:90}}>

        <img src={LOGO} alt="AFK" onClick={onBack} style={{height:34,filter:"drop-shadow(0 0 8px rgba(147,51,234,.45))",cursor:"pointer"}}/>

                <div key={item.id} className="fu" style={{animationDelay:`${(gi*0.1+i*.05)}s`}}>

        <button onClick={()=>setCartOpen(true)} className="gg" style={{position:"fixed",bottom:22,right:18,background:"linear-gradient(135deg,#eab308,#f59e0b)",border:"none",borderRadius:"50%",width:58,height:58,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",zIndex:200}}>

        </button>
      )}

}

// CUSTOMER INFO PAGE
// ─────────────────────────────────────────────
function CustomerInfoPage({ onBack, onNext }) {
  const [name,     setName]    = useState("");
  const [phone,    setPhone]   = useState("");
  const [nameErr,  setNameErr] = useState("");
  const [phoneErr, setPhoneErr]= useState("");

  const submit = () => {
    let ok = true;
    if (!name.trim())  { setNameErr("Vui lòng nhập tên của bạn");        ok=false; } else setNameErr("");
    if (!phone.trim()) { setPhoneErr("Vui lòng nhập số điện thoại");     ok=false; } else setPhoneErr("");
    if (ok) onNext({ name: name.trim(), phone: phone.trim() });
  };

  return (
    <div className="cy" style={{minHeight:"100vh",display:"flex",flexDirection:"column",
      background:"radial-gradient(ellipse at center,#1a0a3e 0%,#0a0714 70%)",position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",width:300,height:300,borderRadius:"50%",background:"rgba(147,51,234,.07)",top:"-10%",right:"-20%",filter:"blur(60px)"}}/>
      <div style={{position:"absolute",width:250,height:250,borderRadius:"50%",background:"rgba(234,179,8,.05)",bottom:"10%",left:"-15%",filter:"blur(50px)"}}/>

      {/* Header */}
      <div style={{padding:"14px 16px",display:"flex",alignItems:"center",gap:10}}>
        <button onClick={onBack} className="gb" style={{padding:"7px 11px",borderRadius:8,fontSize:12,display:"flex",alignItems:"center",gap:4}}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <img src={LOGO} alt="AFK" style={{height:28,filter:"drop-shadow(0 0 6px rgba(147,51,234,.5))"}}/>
      </div>

      {/* Content */}
      <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",padding:"0 24px 40px"}} className="fu">
        <div style={{marginBottom:28,textAlign:"center"}}>
          <div style={{fontSize:28,marginBottom:8}}>👋</div>
          <div style={{fontWeight:900,fontSize:18,color:"#f1f5f9",marginBottom:4,letterSpacing:1}}>Cho chúng tôi biết bạn là ai</div>
          <div style={{fontSize:11,color:"#64748b"}}>Để nhân viên gọi tên bạn khi đồ sẵn nhé</div>
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          {/* Name */}
          <div>
            <div style={{fontSize:9,color:"#94a3b8",letterSpacing:2,marginBottom:6}}>TÊN CỦA BẠN</div>
            <div style={{display:"flex",gap:8,alignItems:"stretch"}}>
              <input
                type="text" value={name}
                onChange={e=>{setName(e.target.value);setNameErr("");}}
                onKeyDown={e=>e.key==="Enter"&&document.getElementById("phone-input").focus()}
                placeholder="Nguyễn Văn A..."
                style={{flex:1,padding:"13px 15px",borderRadius:10,fontSize:14,
                  background:"rgba(255,255,255,.06)",border:nameErr?"1px solid rgba(239,68,68,.6)":"1px solid rgba(147,51,234,.3)",
                  color:"#fff",outline:"none",fontFamily:"'Courier New',monospace"}}/>
              <button
                onClick={()=>{setName(randomNick(name));setNameErr("");}}
                style={{
                  padding:"0 13px",borderRadius:10,border:"1px solid rgba(147,51,234,.45)",
                  background:"rgba(147,51,234,.12)",color:"#a855f7",cursor:"pointer",
                  fontFamily:"'Courier New',monospace",fontSize:11,fontWeight:700,
                  letterSpacing:0.5,whiteSpace:"nowrap",flexShrink:0,
                  transition:"all .2s",lineHeight:1.3,
                }}
                onMouseEnter={e=>{e.currentTarget.style.background="rgba(147,51,234,.25)";e.currentTarget.style.borderColor="#a855f7";}}
                onMouseLeave={e=>{e.currentTarget.style.background="rgba(147,51,234,.12)";e.currentTarget.style.borderColor="rgba(147,51,234,.45)";}}>
                🎲<br/>Nick
              </button>
            </div>
            {nameErr&&<div style={{fontSize:10,color:"#ef4444",marginTop:4}}>{nameErr}</div>}
          </div>

          {/* Phone */}
          <div>
            <div style={{fontSize:9,color:"#94a3b8",letterSpacing:2,marginBottom:6}}>SỐ ĐIỆN THOẠI</div>
            <input
              id="phone-input" type="tel" value={phone}
              onChange={e=>{setPhone(e.target.value);setPhoneErr("");}}
              onKeyDown={e=>e.key==="Enter"&&submit()}
              placeholder="0901 234 567"
              style={{width:"100%",padding:"13px 15px",borderRadius:10,fontSize:14,
                background:"rgba(255,255,255,.06)",border:phoneErr?"1px solid rgba(239,68,68,.6)":"1px solid rgba(147,51,234,.3)",
                color:"#fff",outline:"none",fontFamily:"'Courier New',monospace"}}/>
            {phoneErr&&<div style={{fontSize:10,color:"#ef4444",marginTop:4}}>{phoneErr}</div>}
          </div>

          <button onClick={submit} className="bb gg"
            style={{width:"100%",padding:"16px",borderRadius:11,fontSize:14,letterSpacing:2,marginTop:4,position:"relative",overflow:"hidden"}}>
            <Corner sz={9} c="rgba(0,0,0,.25)"/>⚡ XEM THỰC ĐƠN
          </button>
        </div>
      </div>
    </div>
  );
}

                <div style={{
                  width:5,height:5,borderRadius:"50%",margin:"7px 0",
                  background:"rgba(147,51,234,.45)",
                  boxShadow:"0 0 6px rgba(147,51,234,.6)",
                }}/>
              )}
            </div>
          ))}
        </div>
      </div>
      <div className="fu" style={{animationDelay:".35s"}}>
        <button onClick={onStart} className="bb gg" style={{padding:"17px 52px",borderRadius:12,fontSize:15,letterSpacing:3,position:"relative",overflow:"hidden"}}>
          <Corner sz={9} c="rgba(0,0,0,.25)"/>⚡ GỌI ĐỒ UỐNG
        </button>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// ROOT APP
// ─────────────────────────────────────────────
function App() {
  const [view,      setView]      = useState("landing");
  const [cart,      setCart]      = useState([]);
  const [menuItems, setMenuItems] = useState([]);
  const [customer,  setCustomer]  = useState(null);

  useEffect(() => {
    fsLoadMenu().then(items => { if (items.length) setMenuItems(items); });
  }, []);

  return (
    <div style={{minHeight:"100vh",background:"#0a0714",maxWidth:480,margin:"0 auto",position:"relative",overflow:"hidden"}}>
      <Scanline/>
      {view==="landing" && <LandingPage onStart={()=>setView("info")}/>}
      {view==="info"    && <CustomerInfoPage onBack={()=>setView("landing")} onNext={info=>{setCustomer(info);setView("menu");}}/>}
      {view==="menu"    && <MenuPage cart={cart} setCart={setCart} menuItems={menuItems} customer={customer} onBack={()=>setView("info")}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
