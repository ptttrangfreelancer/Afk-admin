  const [saving,setSaving]=useState(false);
  const [showToast,toastEl]=useToast();
  const canEdit=["owner","manager"].includes(session.role);

  // Form state
  const emptyForm=()=>({
    invoiceNo:"",date:new Date().toISOString().split("T")[0],
    supplier:"",note:"",
    items:[{ingredientId:"",ingredientName:"",quantity:"",unit:"",unitPrice:"",totalPrice:0}],
  });
  const [form,setForm]=useState(emptyForm());

  const load=useCallback(async()=>{
    setLoading(true);
    const[iDocs,gDocs]=await Promise.all([fsGet("purchase_invoices"),fsGet("ingredients")]);
    setInvoices(iDocs.map(parseDoc).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)));
    setIngrs(gDocs.map(parseDoc));
    setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  // Auto invoice number
  const genInvNo=useCallback(()=>{
    const n=invoices.length+1;
    return "NK-"+String(n).padStart(3,"0");
  },[invoices]);

  const openForm=()=>{
    setForm({...emptyForm(),invoiceNo:genInvNo()});
    setView("form");
  };

  // Line item helpers
  const addLine=()=>setForm(f=>({...f,items:[...f.items,{ingredientId:"",ingredientName:"",quantity:"",unit:"",unitPrice:"",totalPrice:0}]}));
  const remLine=idx=>setForm(f=>({...f,items:f.items.filter((_,i)=>i!==idx)}));
  const updLine=(idx,field,val)=>setForm(f=>{
    const items=f.items.map((it,i)=>{
      if(i!==idx) return it;
      const updated={...it,[field]:val};
      if(field==="ingredientId"){
        const found=ingrs.find(x=>x._id===val);
        if(found){updated.ingredientName=found.name;updated.unit=found.unit||"g";}
      }
      // Recalc line total
      const qty=parseFloat(field==="quantity"?val:updated.quantity)||0;
      const up =parseFloat(field==="unitPrice"?val:updated.unitPrice)||0;
      updated.totalPrice=Math.round(qty*up);
      return updated;
    });
    return {...f,items};
  });

  const grandTotal=form.items.reduce((s,i)=>s+(i.totalPrice||0),0);

  // Save invoice → update stock → create logs
  const saveInvoice=async()=>{
    if(!form.supplier.trim()) return showToast("Cần nhập nhà cung cấp",false);
    const validItems=form.items.filter(i=>i.ingredientId&&parseFloat(i.quantity)>0);
    if(validItems.length===0) return showToast("Cần thêm ít nhất 1 nguyên liệu",false);
    setSaving(true);
    try{
      const now=new Date().toISOString();
      const invFields={
        invoiceNo:  toSV(form.invoiceNo),
        date:       toSV(form.date),
        supplier:   toSV(form.supplier),
        note:       toSV(form.note),
        totalAmount:toIV(grandTotal),
        createdBy:  toSV(session.name||""),
        createdAt:  toSV(now),
        items:{arrayValue:{values:validItems.map(it=>({mapValue:{fields:{
          ingredientId:  toSV(it.ingredientId),
          ingredientName:toSV(it.ingredientName),
          quantity:      toFV(parseFloat(it.quantity)||0),
          unit:          toSV(it.unit),
          unitPrice:     toIV(parseFloat(it.unitPrice)||0),
          totalPrice:    toIV(it.totalPrice||0),
        }}}))}}
      };
      // 1. Save invoice
      await fsPost("purchase_invoices",invFields);

      // 2. Update each ingredient stockQuantity + create stock_log
      for(const it of validItems){
        const qty=parseFloat(it.quantity)||0;
        const ingr=ingrs.find(x=>x._id===it.ingredientId);
        const before=ingr?.stockQuantity||0;
        const after=before+qty;
        await fsPatch("ingredients",it.ingredientId,{
          stockQuantity:toFV(after),
          updatedAt:toSV(now),
        });
        await fsPost("stock_logs",{
          ingredientId:  toSV(it.ingredientId),
          ingredientName:toSV(it.ingredientName),
          type:          toSV("import"),
          quantity:      toFV(qty),
          beforeStock:   toFV(before),
          afterStock:    toFV(after),
          reason:        toSV("Nhập hàng — "+form.invoiceNo+" — "+form.supplier),
          createdBy:     toSV(session.name||""),
          createdAt:     toSV(now),
        });
      }

      showToast("Đã lưu hóa đơn "+form.invoiceNo+" ✓");
      await load();
      setView("list");
    }catch(e){showToast("Lỗi: "+e.message,false);}
    setSaving(false);
  };

  // ── DETAIL VIEW ──
  if(view==="detail"&&detailInv) return(
    <div style={{padding:16,display:"flex",flexDirection:"column",gap:12}}>
      {toastEl}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
        <button onClick={()=>setView("list")} className="gb" style={{padding:"6px 10px",borderRadius:7,fontSize:10}}>← Quay lại</button>
        <div>
          <div className="tg" style={{fontWeight:900,fontSize:14}}>{detailInv.invoiceNo}</div>
          <div style={{fontSize:9,color:"#64748b"}}>{detailInv.date} · {detailInv.supplier}</div>
        </div>
      </div>
      <div className="gl" style={{borderRadius:10,overflow:"hidden",position:"relative"}}>
        <Corner sz={7} c="#22c55e"/>
        <div style={{padding:"10px 13px",borderBottom:"1px solid rgba(147,51,234,.1)"}}>
          <div style={{fontSize:9,color:"#64748b",letterSpacing:2,marginBottom:6}}>CHI TIẾT NHẬP HÀNG</div>
          {Array.isArray(detailInv.items)&&detailInv.items.map((it,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
              padding:"8px 0",borderBottom:"1px solid rgba(147,51,234,.07)"}}>
              <div>
                <div style={{fontWeight:700,fontSize:12,color:"#f1f5f9"}}>{it.ingredientName}</div>
                <div style={{fontSize:9,color:"#64748b"}}>{it.quantity} {it.unit} × {vnd(it.unitPrice||0)}</div>
              </div>
              <div className="tg" style={{fontWeight:900,fontSize:12}}>{vnd(it.totalPrice||0)}</div>
            </div>
          ))}
        </div>
        <div style={{padding:"10px 13px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontWeight:700,fontSize:11,letterSpacing:1}}>TỔNG TIỀN</span>
          <span className="tg" style={{fontWeight:900,fontSize:16}}>{vnd(detailInv.totalAmount||0)}</span>
        </div>
      </div>
      {detailInv.note&&(
        <div className="glg" style={{borderRadius:9,padding:"9px 13px",position:"relative"}}>
          <Corner sz={6} c="#eab308"/>
          <div style={{fontSize:9,color:"#ca8a04",marginBottom:3}}>GHI CHÚ</div>
          <div style={{fontSize:11,color:"#f1f5f9"}}>{detailInv.note}</div>
        </div>
      )}
      <div style={{fontSize:9,color:"#334155",textAlign:"center"}}>
        Tạo bởi {detailInv.createdBy} · {new Date(detailInv.createdAt).toLocaleString("vi-VN")}
      </div>
    </div>
  );

  // ── FORM VIEW ──
  if(view==="form") return(
    <div style={{padding:16,display:"flex",flexDirection:"column",gap:12,paddingBottom:40}}>
      {toastEl}
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <button onClick={()=>setView("list")} className="gb" style={{padding:"6px 10px",borderRadius:7,fontSize:10}}>← Huỷ</button>
        <div className="tg" style={{fontWeight:900,fontSize:14,letterSpacing:2}}>🧾 TẠO HÓA ĐƠN NHẬP</div>
      </div>

      {/* Header info */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div>
          <div style={{fontSize:9,color:"#64748b",letterSpacing:1,marginBottom:4}}>SỐ HÓA ĐƠN</div>
          <Inp value={form.invoiceNo} onChange={e=>setForm({...form,invoiceNo:e.target.value})} placeholder="NK-001"/>
        </div>
        <div>
          <div style={{fontSize:9,color:"#64748b",letterSpacing:1,marginBottom:4}}>NGÀY NHẬP</div>
          <Inp type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/>
        </div>
      </div>
      <div>
        <div style={{fontSize:9,color:"#64748b",letterSpacing:1,marginBottom:4}}>NHÀ CUNG CẤP</div>
        <Inp value={form.supplier} onChange={e=>setForm({...form,supplier:e.target.value})} placeholder="Trung Nguyên, Vinamilk..."/>
      </div>

      {/* Line items */}
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{fontSize:9,color:"#64748b",letterSpacing:2}}>DANH SÁCH HÀNG ({form.items.length} dòng)</div>
          <button onClick={addLine} className="gb" style={{padding:"5px 11px",borderRadius:6,fontSize:10}}>+ Thêm dòng</button>
        </div>

        {/* Header row */}
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr auto",gap:6,marginBottom:5,padding:"0 4px"}}>
          {["Nguyên liệu","Số lượng","Đơn giá","Thành tiền",""].map((h,i)=>(
            <div key={i} style={{fontSize:8,color:"#475569",letterSpacing:1}}>{h}</div>
          ))}
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:7}}>
          {form.items.map((it,idx)=>(
            <div key={idx} className="gl" style={{borderRadius:8,padding:"9px 10px",display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr auto",gap:6,alignItems:"center"}}>
              {/* Ingredient selector */}
              <Sel value={it.ingredientId} onChange={e=>updLine(idx,"ingredientId",e.target.value)} style={{fontSize:10,padding:"6px 8px"}}>
                <option value="">-- Chọn --</option>
                {ingrs.map(g=><option key={g._id} value={g._id}>{g.name}</option>)}
              </Sel>
              {/* Quantity */}
              <input type="number" value={it.quantity} onChange={e=>updLine(idx,"quantity",e.target.value)}
                placeholder="0" min="0" style={{padding:"6px 8px",borderRadius:6,fontSize:10,width:"100%"}}/>
              {/* Unit price */}
              <input type="number" value={it.unitPrice} onChange={e=>updLine(idx,"unitPrice",e.target.value)}
                placeholder="0" min="0" style={{padding:"6px 8px",borderRadius:6,fontSize:10,width:"100%"}}/>
              {/* Total */}
              <div style={{fontSize:10,fontWeight:700,color:"#eab308",textAlign:"right"}}>
                {it.totalPrice>0?vnd(it.totalPrice):"-"}
              </div>
              {/* Remove */}
              <button onClick={()=>remLine(idx)} disabled={form.items.length===1}
                className="rb" style={{padding:"4px 7px",borderRadius:5,fontSize:9,opacity:form.items.length===1?.3:1}}>✕</button>
            </div>
          ))}
        </div>
      </div>

      {/* Grand total */}
      <div className="glg" style={{borderRadius:10,padding:"12px 15px",position:"relative"}}>
        <Corner sz={7} c="#eab308"/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:9,color:"#ca8a04",letterSpacing:1}}>TỔNG TIỀN NHẬP</div>
            <div style={{fontSize:9,color:"#64748b",marginTop:2}}>
              {form.items.filter(i=>i.ingredientId).length} nguyên liệu · kho tự cập nhật khi lưu
            </div>
          </div>
          <div className="tg" style={{fontSize:22,fontWeight:900}}>{vnd(grandTotal)}</div>
        </div>
      </div>

      {/* Note */}
      <div>
        <div style={{fontSize:9,color:"#64748b",letterSpacing:1,marginBottom:4}}>GHI CHÚ (tuỳ chọn)</div>
        <textarea value={form.note} onChange={e=>setForm({...form,note:e.target.value})}
          rows={2} placeholder="Lưu ý, chiết khấu, điều kiện thanh toán..."
          style={{width:"100%",padding:"9px 12px",borderRadius:8,fontSize:11,resize:"none",
            background:"rgba(255,255,255,.05)",border:"1px solid rgba(147,51,234,.3)",
            color:"#fff",outline:"none",fontFamily:"'Courier New',monospace",lineHeight:1.5}}>
        </textarea>
      </div>

      <button onClick={saveInvoice} disabled={saving} className="bb gg"
        style={{padding:"14px",borderRadius:10,fontSize:13,letterSpacing:2,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
        {saving?<><Spinner/> ĐANG LƯU...</>:"💾 LƯU HÓA ĐƠN & CẬP NHẬT KHO"}
      </button>
    </div>
  );

  // ── LIST VIEW ──
  return(
    <div style={{padding:16,display:"flex",flexDirection:"column",gap:12}}>
      {toastEl}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div className="tg" style={{fontWeight:900,fontSize:14,letterSpacing:2}}>🧾 NHẬP HÀNG</div>
          <div style={{fontSize:9,color:"#64748b",marginTop:2}}>Tự động cập nhật tồn kho sau khi lưu</div>
        </div>
        {canEdit&&<button onClick={openForm} className="bb" style={{padding:"9px 16px",borderRadius:9,fontSize:11,display:"flex",alignItems:"center",gap:6}}>
          + TẠO HÓA ĐƠN
        </button>}
      </div>

      {/* Summary stats */}
      {!loading&&invoices.length>0&&(()=>{
        const thisMonth=invoices.filter(i=>{
          const d=new Date(i.createdAt),n=new Date();
          return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();
        });
        const totalMonth=thisMonth.reduce((s,i)=>s+(i.totalAmount||0),0);
        const totalAll=invoices.reduce((s,i)=>s+(i.totalAmount||0),0);
        return(
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
            {[["📦 Tổng HĐ",invoices.length,"#9333ea"],["🗓️ Tháng này",thisMonth.length,"#a855f7"],["💰 Chi tháng này",vnd(totalMonth),"#eab308"]].map(([lb,v,c])=>(
              <div key={lb} className="gl" style={{borderRadius:9,padding:"10px 11px",position:"relative",textAlign:"center"}}>
                <Corner sz={5} c={c}/>
                <div style={{fontSize:8,color:"#64748b",marginBottom:2}}>{lb}</div>
                <div style={{fontWeight:900,fontSize:13,color:c}}>{v}</div>
              </div>
            ))}
          </div>
        );
      })()}

      {/* Invoice list */}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {loading?<div style={{textAlign:"center",padding:32}}><Spinner/></div>
        :invoices.length===0
          ?<div className="gl" style={{borderRadius:10,padding:32,textAlign:"center",position:"relative"}}>
            <Corner sz={7}/>
            <div style={{fontSize:28,marginBottom:8}}>🧾</div>
            <div style={{color:"#475569",fontSize:11,marginBottom:4}}>Chưa có hóa đơn nào</div>
            <div style={{color:"#334155",fontSize:9}}>Bấm "+ TẠO HÓA ĐƠN" để ghi nhận lần nhập hàng đầu tiên</div>
           </div>
          :invoices.map(inv=>(
            <div key={inv._id} className="gl" style={{borderRadius:10,padding:"11px 13px",position:"relative",cursor:"pointer"}}
              onClick={()=>{setDetailInv(inv);setView("detail");}}>
              <Corner sz={6} c="#22c55e"/>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                    <span className="tg" style={{fontWeight:900,fontSize:13}}>{inv.invoiceNo}</span>
                    <span style={{fontSize:9,color:"#475569"}}>{inv.date}</span>
                  </div>
                  <div style={{fontSize:11,color:"#94a3b8",marginBottom:2}}>🏭 {inv.supplier}</div>
                  <div style={{fontSize:9,color:"#64748b"}}>
                    {Array.isArray(inv.items)?inv.items.length+" nguyên liệu":"—"}
                    {inv.note&&" · "+inv.note.substring(0,30)+(inv.note.length>30?"...":"")}
                  </div>
                </div>
                <div style={{textAlign:"right",flexShrink:0,marginLeft:12}}>
                  <div className="tg" style={{fontWeight:900,fontSize:14}}>{vnd(inv.totalAmount||0)}</div>
                  <div style={{fontSize:8,color:"#334155",marginTop:2}}>{inv.createdBy}</div>
                </div>
              </div>
            </div>
          ))
        }
      </div>
    </div>
  );
}

// ─── ROOT APP ───
function App(){
  const [session,setSession]=useState(()=>loadSession());
  const [page,setPage]=useState("dashboard");
  const [collapsed,setCollapsed]=useState(false);

  if(!session) return(<><Scanline/><LoginPage onLogin={s=>{setSession(s);const a=ROLE_ACCESS[s.role]||["orders"];setPage(a[0]);}}/></>);
  const logout=()=>{clearSession();setSession(null);};

  const PAGES={
    dashboard:<Dashboard session={session}/>,
    orders:<OrdersPage session={session}/>,
    menu:<MenuPage session={session}/>,
    employees:<EmployeesPage session={session}/>,
    ingredients:<IngredientsPage session={session}/>,
    recipes:<RecipesPage session={session}/>,
    inventory:<InventoryPage session={session}/>,
    invoices:<PurchaseInvoicesPage session={session}/>,
    analytics:<AnalyticsPage/>,
    reports:<ReportsPage/>,
    settings:<SettingsPage session={session}/>,
  };

  return(
    <div style={{minHeight:"100vh",background:"#0a0714",display:"flex"}}>
      <Scanline/>
      <Sidebar active={page} onNav={setPage} session={session} onLogout={logout} collapsed={collapsed} onToggle={()=>setCollapsed(p=>!p)}/>
      <div style={{flex:1,overflowY:"auto",overflowX:"hidden",maxHeight:"100vh"}}>
        <div className="fu" key={page}>
          {PAGES[page]||<div style={{padding:24,color:"#475569",fontSize:11}}>Trang không tồn tại</div>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
